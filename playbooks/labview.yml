---
# Serve every VM console through one console service.
#
# The host role installs and runs labview as part of preparing a hypervisor.
# It listens on loopback; put a reverse proxy in front of it to terminate TLS
# and authenticate. The console service guide states what any proxy has to do,
# and why each detail matters.
- name: Hypervisors with the labview console service
  hosts: qemu_hosts
  become: true

  roles:
    - role: maglo.qemu.host

    # The vms role is the only thing that knows a VM's VNC display, its socket
    # paths and its unit name, so it writes the per-machine inventory file that
    # labview reads. The directory has to match host_labview_inventory_dir,
    # which is /etc/labview/inventory.d by default.
    - role: maglo.qemu.vms
      vars:
        vms_labview_inventory_dir: /etc/labview/inventory.d
        vms_list:
          - name: web01
            disk_size: 20G
            memory: 2048
            state: started
          - name: db01
            disk_size: 40G
            memory: 4096
            state: started
