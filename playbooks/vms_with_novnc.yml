---
# Playbook that creates QEMU/KVM VMs with noVNC web console enabled.
# Usage:
#   ansible-playbook -i inventory.yml vms_with_novnc.yml
- name: Configure QEMU/KVM host and create VMs with noVNC
  hosts: qemu_hosts
  become: true
  roles:
    # Install QEMU packages and noVNC package
    - role: maglo.qemu.host
      vars:
        host_novnc_enabled: true

    # Create VMs with noVNC web console enabled
    - role: maglo.qemu.vms
      vars:
        vms_list:
          - name: web01
            disk_size: 40G
            memory: 4G
            cpus: 4
            novnc_enabled: true
            novnc_port: 6080  # Optional, auto-assigned if omitted
            state: started
          - name: db01
            disk_size: 100G
            memory: 8G
            cpus: 8
            novnc_enabled: true
            # Port auto-assigned (6081 based on VNC display number)
            state: started
