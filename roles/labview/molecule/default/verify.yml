---
- name: Verify - labview console service
  hosts: all
  gather_facts: false
  tasks:
    # ── Service account ───────────────────────────────────────
    - name: Read the labview account
      ansible.builtin.getent:
        database: passwd
        key: labview
      become: true

    - name: Assert the labview account
      vars:
        entry: "{{ ansible_facts.getent_passwd['labview'] }}"
      ansible.builtin.assert:
        that:
          # getent_passwd: [password, uid, gid, gecos, home, shell]
          - entry[4] == '/var/lib/labview'
          - entry[5] == '/sbin/nologin'
        fail_msg: "labview account is {{ entry }}"

    - name: Read the qemu group
      ansible.builtin.getent:
        database: group
        key: qemu
      become: true

    - name: Assert labview is a member of the qemu group
      ansible.builtin.assert:
        that:
          - "'labview' in ansible_facts.getent_group['qemu'][2].split(',')"
        fail_msg: >-
          labview is not in the qemu group, so it cannot open the serial and
          QMP sockets of a VM.

    # ── Binary ────────────────────────────────────────────────
    - name: Stat the labview binary
      ansible.builtin.stat:
        path: /usr/local/bin/labview
      register: binary

    - name: Assert the labview binary
      ansible.builtin.assert:
        that:
          - binary.stat.exists
          - binary.stat.pw_name == 'root'
          - binary.stat.mode == '0755'

    - name: Ask the binary for its version
      ansible.builtin.command: /usr/local/bin/labview -version
      register: version
      changed_when: false

    - name: Assert the installed version is the one the role pins
      ansible.builtin.assert:
        that:
          - version.stdout | trim == '0.2.0'
        fail_msg: "installed labview reports {{ version.stdout | trim }}"

    # ── Directories ───────────────────────────────────────────
    - name: Stat the labview directories
      ansible.builtin.stat:
        path: "{{ item }}"
      register: dirs
      loop:
        - /var/lib/labview
        - /var/lib/labview/recordings
        - /var/lib/labview/screenshots
        - /etc/labview/inventory.d

    - name: Assert the state and recordings directories
      ansible.builtin.assert:
        that:
          - item.stat.isdir
          - item.stat.pw_name == 'labview'
          - item.stat.gr_name == 'labview'
          - item.stat.mode == '0750'
      loop: "{{ dirs.results[0:2] }}"
      loop_control:
        label: "{{ item.item }}"

    # QEMU writes a frame here as its own user and labview reads it back, so
    # the group is qemu, it is group writable, and setgid keeps a new frame in
    # that group.
    - name: Assert the screenshot directory is shared with QEMU
      vars:
        entry: "{{ dirs.results[2].stat }}"
      ansible.builtin.assert:
        that:
          - entry.isdir
          - entry.pw_name == 'labview'
          - entry.gr_name == 'qemu'
          - entry.mode == '02770'
        fail_msg: "screenshot directory is {{ entry.pw_name }}:{{ entry.gr_name }} {{ entry.mode }}"

    # Both this role and the vms role create it, with the same owner and mode,
    # so neither fights the other.
    - name: Assert the inventory directory
      vars:
        entry: "{{ dirs.results[3].stat }}"
      ansible.builtin.assert:
        that:
          - entry.isdir
          - entry.pw_name == 'root'
          - entry.gr_name == 'root'
          - entry.mode == '0755'

    # ── systemd unit ──────────────────────────────────────────
    - name: Stat the labview unit
      ansible.builtin.stat:
        path: /etc/systemd/system/labview.service
      register: unit

    - name: Assert the labview unit file
      ansible.builtin.assert:
        that:
          - unit.stat.exists
          - unit.stat.pw_name == 'root'
          - unit.stat.mode == '0644'

    - name: Read the labview unit
      ansible.builtin.slurp:
        src: /etc/systemd/system/labview.service
      register: unit_content

    - name: Assert the labview unit content
      vars:
        content: "{{ unit_content.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'Ansible managed' in content"
          - "'User=labview' in content"
          - "'Group=labview' in content"
          # Without this labview cannot open a socket QEMU created.
          - "'SupplementaryGroups=qemu' in content"
          - "'-listen 127.0.0.1:8080' in content"
          - "'-inventory /etc/labview/inventory.d' in content"
          - "'-recordings-dir /var/lib/labview/recordings' in content"
          - "'-screenshot-dir /var/lib/labview/screenshots' in content"
          - "'-identity-header X-Forwarded-User' in content"
          - "'-host-access local' in content"
          # Hardening that the role must not lose: labview writes only under
          # its state directory, and ProcSubset has to stay permissive or the
          # details tab loses the QEMU command line.
          - "'ProtectSystem=strict' in content"
          - "'ReadWritePaths=/var/lib/labview' in content"
          - "'ProcSubset=all' in content"
          - "'NoNewPrivileges=yes' in content"

    # ── polkit rule ───────────────────────────────────────────
    - name: Stat the polkit rule
      ansible.builtin.stat:
        path: /etc/polkit-1/rules.d/50-labview-units.rules
      register: rule

    - name: Assert the polkit rule file
      ansible.builtin.assert:
        that:
          - rule.stat.exists
          - rule.stat.pw_name == 'root'
          - rule.stat.mode == '0644'

    - name: Read the polkit rule
      ansible.builtin.slurp:
        src: /etc/polkit-1/rules.d/50-labview-units.rules
      register: rule_content

    - name: Assert the polkit rule grants exactly what labview needs
      vars:
        content: "{{ rule_content.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'org.freedesktop.systemd1.manage-units' in content"
          - '''subject.user !== "labview"'' in content'
          # Narrowed to the units the vms role creates, not upstream's
          # deliberately wide pattern.
          - "'qemu-vm@[A-Za-z0-9._-]+' in content"
          - "'verb === \"start\"' in content"
          - "'verb === \"stop\"' in content"
          - "'verb === \"restart\"' in content"
          # Nothing else is labview's business, even on a unit it may restart.
          - "'\"mask\"' not in content"
          - "'\"enable\"' not in content"

    # ── The service, and what it serves ───────────────────────
    - name: Read the labview service state
      ansible.builtin.systemd_service:
        name: labview.service
      register: service
      become: true

    - name: Assert labview is enabled and running
      ansible.builtin.assert:
        that:
          - service.status.UnitFileState == 'enabled'
          - service.status.ActiveState == 'active'
        fail_msg: >-
          labview.service is {{ service.status.ActiveState }}
          ({{ service.status.SubState | default('') }}).

    # The end of the contract with the vms role: the machine file that role
    # wrote is the machine this service serves.
    - name: Ask labview for its machines
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/api/machines
        return_content: true
      register: machines
      retries: 5
      delay: 2
      until: machines is succeeded

    - name: Assert labview serves the VM the vms role wrote
      vars:
        served: "{{ machines.json.machines | map(attribute='id') | list }}"
      ansible.builtin.assert:
        that:
          - "'web01' in served"
        fail_msg: "labview serves {{ served }}"
