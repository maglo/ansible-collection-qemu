---
# Release assets are named for the Go architecture, which is not what Ansible
# reports. Only the architectures the release builds for belong here; an
# unknown one fails in validate.yml rather than guessing a download.
_labview_arch_map:
  x86_64: amd64
  aarch64: arm64

# The architecture the asset URL uses: what the deployer pinned, or what the
# host reports. An empty string means neither, which validate.yml refuses.
_labview_arch: >-
  {{ labview_arch | default(_labview_arch_map[ansible_architecture] | default(''), true) }}
