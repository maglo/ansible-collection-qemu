---
# Fail before anything is installed, with a message that names the fix.

- name: Validate that the architecture has a release asset
  ansible.builtin.assert:
    that:
      - _labview_arch | length > 0
    fail_msg: >-
      No labview release asset is known for architecture
      `{{ ansible_architecture }}`. The release builds linux/amd64 and
      linux/arm64. Set `labview_arch` to the suffix of the asset to install,
      or point `labview_binary_url` at your own build.
    success_msg: "labview will be installed for {{ _labview_arch }}"

- name: Validate that the listen address has a port
  ansible.builtin.assert:
    that:
      - labview_listen is string
      - "':' in labview_listen"
    fail_msg: >-
      `labview_listen` must be an address and a port, such as 127.0.0.1:8080.
      It is `{{ labview_listen }}`.

# labview joins the QEMU service group to open the sockets, so the group has
# to exist before the account is created. It is the `host` role, or the
# qemu-kvm package it installs, that creates it — a missing group means this
# play is running ahead of that, and the `user` task would fail with nothing
# but a useradd error to go on.
- name: Look up the QEMU service group
  ansible.builtin.getent:
    database: group
    key: "{{ labview_qemu_group }}"
    fail_key: false
  become: true

- name: Validate that the QEMU service group exists
  ansible.builtin.assert:
    that:
      - ansible_facts.getent_group[labview_qemu_group] is not none
    fail_msg: >-
      Group `{{ labview_qemu_group }}` does not exist on this host. labview
      joins it to open the serial and QMP sockets of a VM. Run the
      `maglo.qemu.host` role first, or set `labview_qemu_group` to the group
      that owns the sockets.

# labview authenticates nobody: the identity it acts on is a header a proxy
# sets. A run that publishes it beyond loopback without a proxy in front hands
# every viewer the write lease, so say so loudly. It is not an error — a lab
# may mean it — so this warns rather than fails.
- name: Warn when labview is published beyond loopback
  ansible.builtin.debug:
    msg: >-
      labview will listen on {{ labview_listen }}, which is not loopback.
      labview performs no authentication of its own: anyone who can reach this
      address can take the write lease of every machine. Put a reverse proxy
      that terminates TLS and authenticates in front of it, or bind loopback
      and reach it through one. See the console service guide.
  when: not (labview_listen is match('^(127\.|\[?::1\]?:|localhost:)'))
