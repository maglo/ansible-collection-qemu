---
- name: Install the labview systemd unit
  ansible.builtin.template:
    src: labview.service.j2
    dest: /etc/systemd/system/labview.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify:
    - Reload systemd
    - Restart labview

# The handlers run at the end of the play, so a first run would otherwise
# start the service from a unit systemd has not read yet.
- name: Apply the pending unit changes
  ansible.builtin.meta: flush_handlers

- name: Enable and start the labview service
  ansible.builtin.systemd_service:
    name: labview.service
    enabled: "{{ labview_service_enabled }}"
    state: "{{ labview_service_state }}"
    daemon_reload: true
  become: true
