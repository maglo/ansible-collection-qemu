---
# ── The binary ────────────────────────────────────────────────────
#
# labview ships as a statically linked binary on each release of
# maglo/qemu-lab-manager. There is no container image and no package, so the
# role downloads the release asset and verifies it.

# Release of labview to install.
labview_version: "0.2.0"

# Architecture suffix of the release asset. When null the role derives it from
# `ansible_architecture`: x86_64 gives amd64, aarch64 gives arm64. Set it
# explicitly for a host whose architecture the role does not know.
labview_arch: null

# Where the asset comes from. Override it for a mirror or an internal build.
labview_binary_url: >-
  https://github.com/maglo/qemu-lab-manager/releases/download/v{{ labview_version }}/labview-linux-{{ _labview_arch }}

# Checksum of the asset, in the form get_url takes. The default points at the
# SHA256SUMS file of the same release; get_url fetches it and matches the entry
# whose name is the basename of `labview_binary_url`. Pin a literal
# "sha256:<digest>" instead to avoid trusting a file served beside the binary.
# Setting it to null downloads without verifying anything, which is for a
# mirror that publishes no checksum. Leave it on.
labview_checksum: >-
  sha256:https://github.com/maglo/qemu-lab-manager/releases/download/v{{ labview_version }}/SHA256SUMS

# Where the binary is installed.
labview_binary_path: /usr/local/bin/labview

# ── The service account ───────────────────────────────────────────
#
# labview runs as its own account, never as root: systemd short-circuits the
# privilege check for a root caller, so the polkit rule below would bound
# nothing at all.

labview_user: labview
labview_group: labview

# Group of the QEMU serial and QMP sockets, joined as a supplementary group so
# labview can open them. It must match `host_service_group` of the host role,
# and that role's `host_vm_umask` has to leave the sockets group writable.
labview_qemu_group: qemu

# ── Directories ───────────────────────────────────────────────────

# Base directory for everything labview writes.
labview_state_dir: /var/lib/labview

# Serial transcripts, one per machine per run. This is where the guest boot
# output lives now that it no longer reaches the journal.
labview_recordings_dir: "{{ labview_state_dir }}/recordings"

# Screenshot exchange, shared with QEMU: QEMU writes a frame here over QMP and
# labview reads it and removes it again. It is setgid to `labview_qemu_group`
# so that a frame QEMU writes stays readable by labview.
labview_screenshot_dir: "{{ labview_state_dir }}/screenshots"

# Directory of per-machine inventory files. It must match
# `vms_labview_inventory_dir` of the vms role, which writes one file per VM.
labview_inventory_dir: /etc/labview/inventory.d

# ── The service ───────────────────────────────────────────────────

# Address labview serves on. Loopback by default: labview authenticates
# nobody, and a console that only the host can reach is what makes its write
# lease mean anything. Publishing it directly is a deliberate decision — see
# the console service guide, which covers putting a proxy in front instead.
labview_listen: 127.0.0.1:8080

# Host introspection: local, none or fake. `local` reads /proc for the QEMU
# command line of a machine, which is what the details tab shows.
labview_host_access: local

# Request header carrying the identity a proxy has authenticated. labview
# trusts it completely, so a proxy must set it and must discard whatever the
# client sent.
labview_identity_header: X-Forwarded-User

# Extra command line arguments, appended verbatim. For settings the role does
# not model, such as -lease-idle or -tile-mode.
labview_extra_args: []

# ── polkit ────────────────────────────────────────────────────────

# The rule is mandatory. A system service has no logind session, so without it
# polkit falls through to auth_admin, finds no agent to answer, and every
# power operation fails.
labview_polkit_rule_path: /etc/polkit-1/rules.d/50-labview-units.rules

# Units labview may start, stop and restart, as a JavaScript regular
# expression. The default matches the units the vms role creates and nothing
# else. Narrow it further to bound labview to part of a hypervisor.
labview_unit_pattern: '^qemu-vm@[A-Za-z0-9._-]+\.service$'

# ── Service state ─────────────────────────────────────────────────

labview_service_enabled: true
labview_service_state: started
