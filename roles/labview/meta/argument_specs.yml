---
argument_specs:
  main:
    short_description: Deploy the labview console service on a QEMU/KVM host.
    description:
      - Installs the labview binary from a release of
        U(https://github.com/maglo/qemu-lab-manager), creates its service
        account and directories, installs the polkit rule that lets it power
        machines, and runs it as C(labview.service).
      - labview serves the framebuffer, the serial line and the details of
        every machine behind one port, reading the per-machine inventory the
        C(vms) role writes through C(vms_labview_inventory_dir).
      - The role deploys no reverse proxy and manages no TLS material. labview
        listens on loopback and authenticates nobody; terminating TLS and
        authenticating belongs to a proxy in front of it, whatever that proxy
        is. See the console service guide.
    options:
      labview_version:
        description: Release of labview to install.
        type: str
        default: "0.2.0"
      labview_arch:
        description: >-
          Architecture suffix of the release asset. When unset the role
          derives it from C(ansible_architecture): C(x86_64) gives C(amd64)
          and C(aarch64) gives C(arm64), and any other architecture fails the
          run rather than guessing.
        type: str
        default: null
      labview_binary_url:
        description: >-
          URL of the release asset. The default names the asset of
          C(labview_version) for the derived architecture.
        type: str
        default: https://github.com/maglo/qemu-lab-manager/releases/download/v{{ labview_version }}/labview-linux-{{ _labview_arch }}
      labview_checksum:
        description: >-
          Checksum of the asset, in the form C(ansible.builtin.get_url) takes.
          The default points at the C(SHA256SUMS) of the same release, which
          C(get_url) fetches and matches by the basename of
          C(labview_binary_url). Pin a literal C(sha256:<digest>) to avoid
          trusting a file served beside the binary. Setting it to C(null)
          downloads without verifying anything.
        type: str
        default: sha256:https://github.com/maglo/qemu-lab-manager/releases/download/v{{ labview_version }}/SHA256SUMS
      labview_binary_path:
        description: Where the binary is installed.
        type: path
        default: /usr/local/bin/labview
      labview_user:
        description: >-
          Service account labview runs as. polkit matches the subject by user
          name, so this must be a real host account. Never C(root): systemd
          short-circuits the privilege check for a root caller, so the polkit
          rule would bound nothing.
        type: str
        default: labview
      labview_group:
        description: Primary group of the service account.
        type: str
        default: labview
      labview_qemu_group:
        description: >-
          Group of the QEMU serial and QMP sockets, joined as a supplementary
          group so labview can open them. It must match C(host_service_group)
          of the C(host) role, whose C(host_vm_umask) has to leave the sockets
          group writable.
        type: str
        default: qemu
      labview_state_dir:
        description: Base directory for everything labview writes.
        type: path
        default: /var/lib/labview
      labview_recordings_dir:
        description: >-
          Directory for the serial transcripts, one per machine per run. This
          is where guest boot output lives now that it no longer reaches the
          journal of C(qemu-vm@<name>.service).
        type: path
        default: "{{ labview_state_dir }}/recordings"
      labview_screenshot_dir:
        description: >-
          Directory shared with QEMU for screenshots. QEMU writes a frame here
          over QMP and labview reads it and removes it again, so the role
          creates it setgid to C(labview_qemu_group).
        type: path
        default: "{{ labview_state_dir }}/screenshots"
      labview_inventory_dir:
        description: >-
          Directory of per-machine inventory files. It must match
          C(vms_labview_inventory_dir) of the C(vms) role, which writes one
          file per VM.
        type: path
        default: /etc/labview/inventory.d
      labview_listen:
        description: >-
          Address and port labview serves on. Loopback by default: labview
          authenticates nobody, so anyone who can reach this address holds the
          write lease of every machine. The role warns when it is not
          loopback.
        type: str
        default: 127.0.0.1:8080
      labview_host_access:
        description: >-
          Host introspection mode. C(local) reads C(/proc) for the QEMU
          command line of a machine, which is what the details tab shows.
        type: str
        default: local
        choices:
          - local
          - none
          - fake
      labview_identity_header:
        description: >-
          Request header carrying the identity a proxy has authenticated.
          labview trusts it completely, so the proxy must set it and must
          discard whatever the client sent.
        type: str
        default: X-Forwarded-User
      labview_extra_args:
        description: >-
          Extra command line arguments, appended to C(ExecStart) verbatim. For
          settings the role does not model, such as C(-lease-idle) or
          C(-tile-mode).
        type: list
        elements: str
        default: []
      labview_polkit_rule_path:
        description: >-
          Where the polkit rule is installed. The rule is mandatory: a system
          service has no logind session, so without it polkit falls through to
          C(auth_admin), finds no agent to answer, and every power operation
          fails.
        type: path
        default: /etc/polkit-1/rules.d/50-labview-units.rules
      labview_unit_pattern:
        description: >-
          Units labview may start, stop and restart, as a JavaScript regular
          expression. The default matches the units the C(vms) role creates
          and nothing else. Narrow it further to bound labview to part of a
          hypervisor.
        type: str
        default: ^qemu-vm@[A-Za-z0-9._-]+\.service$
      labview_service_enabled:
        description: Whether C(labview.service) is enabled at boot.
        type: bool
        default: true
      labview_service_state:
        description: State to leave C(labview.service) in.
        type: str
        default: started
        choices:
          - started
          - stopped
