---
# Packages to install for QEMU/KVM host
host_packages:
  - qemu-kvm
  - qemu-img
  - swtpm
  - swtpm-tools
  - socat
  - genisoimage
  - edk2-ovmf

# Directory containing QEMU VM configuration files (one per VM)
host_vm_config_dir: /etc/qemu/vms

# Directory containing QEMU VM disk images
host_vm_image_dir: /var/lib/qemu/images

# User and group for the QEMU systemd service
host_service_user: qemu
host_service_group: qemu

# Umask of the qemu-vm@.service units, and so the mode of every socket QEMU
# creates: 0777 minus this value. 0007 leaves the serial and QMP sockets at
# 0770, which a console service running in host_service_group can open.
# Set 0022 for the mode of releases before this one, which no group member
# could connect to.
host_vm_umask: "0007"

# ── The labview console service ───────────────────────────────────
#
# The host role installs and runs labview, which serves the framebuffer,
# serial line and control channel of every machine behind one port. Set this
# to false on a host that should not run it, for example one with no outbound
# network for the download.
host_labview_enabled: true

# Release of labview to install.
host_labview_version: "0.2.0"

# Architecture suffix of the release asset. When null the role derives it from
# `ansible_architecture`: x86_64 gives amd64, aarch64 gives arm64. Set it
# explicitly for a host whose architecture the role does not know.
host_labview_arch: null

# Where the asset comes from. Override it for a mirror or an internal build.
host_labview_binary_url: >-
  https://github.com/maglo/qemu-lab-manager/releases/download/v{{ host_labview_version }}/labview-linux-{{ _host_labview_arch }}

# Checksum of the asset, in the form get_url takes. The default points at the
# SHA256SUMS file of the same release; get_url fetches it and matches the entry
# whose name is the basename of `host_labview_binary_url`. Pin a literal
# "sha256:<digest>" instead to avoid trusting a file served beside the binary.
# Setting it to null downloads without verifying anything.
host_labview_checksum: >-
  sha256:https://github.com/maglo/qemu-lab-manager/releases/download/v{{ host_labview_version }}/SHA256SUMS

# Where the binary is installed.
host_labview_binary_path: /usr/local/bin/labview

# The service account. labview never runs as root: systemd short-circuits the
# privilege check for a root caller, so the polkit rule below would bound
# nothing at all.
host_labview_user: labview
host_labview_group: labview

# Group of the QEMU serial and QMP sockets, joined as a supplementary group so
# labview can open them. `host_vm_umask` is what leaves those sockets group
# writable.
host_labview_qemu_group: "{{ host_service_group }}"

# Base directory for everything labview writes.
host_labview_state_dir: /var/lib/labview

# Serial transcripts, one per machine per run. This is where the guest boot
# output lives now that it no longer reaches the journal.
host_labview_recordings_dir: "{{ host_labview_state_dir }}/recordings"

# Screenshot exchange, shared with QEMU: QEMU writes a frame here over QMP and
# labview reads it and removes it again. It is setgid to the QEMU group so
# that a frame QEMU writes stays readable by labview.
host_labview_screenshot_dir: "{{ host_labview_state_dir }}/screenshots"

# Directory of per-machine inventory files. It must match
# `vms_labview_inventory_dir` of the vms role, which writes one file per VM.
host_labview_inventory_dir: /etc/labview/inventory.d

# Address labview serves on. Loopback by default: labview authenticates
# nobody, and a console that only the host can reach is what makes its write
# lease mean anything. Put a reverse proxy in front of it to publish it.
host_labview_listen: 127.0.0.1:8080

# Host introspection: local, none or fake. `local` reads /proc for the QEMU
# command line of a machine, which is what the details tab shows.
host_labview_host_access: local

# Request header carrying the identity a proxy has authenticated. labview
# trusts it completely, so a proxy must set it and must discard whatever the
# client sent.
host_labview_identity_header: X-Forwarded-User

# Extra command line arguments, appended verbatim. For settings the role does
# not model, such as -lease-idle or -tile-mode.
host_labview_extra_args: []

# The polkit rule is mandatory. A system service has no logind session, so
# without it polkit falls through to auth_admin, finds no agent to answer, and
# every power operation fails.
host_labview_polkit_rule_path: /etc/polkit-1/rules.d/50-labview-units.rules

# Units labview may start, stop and restart, as a JavaScript regular
# expression. The default matches the units the vms role creates and nothing
# else. Narrow it further to bound labview to part of a hypervisor.
host_labview_unit_pattern: '^qemu-vm@[A-Za-z0-9._-]+\.service$'

# State to leave labview.service in.
host_labview_service_state: started

# Base directory for per-VM swtpm state
host_swtpm_state_dir: /var/lib/swtpm
