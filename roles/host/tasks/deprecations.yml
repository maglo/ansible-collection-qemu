---
# Deprecation notices for the host role.
#
# Support for Enterprise Linux 9 is deprecated. When it is removed, delete this
# file, its import in main.yml, the host_el9_deprecation_warning default and its
# argument spec.

# The notice needs ansible_distribution_major_version. Gather minimum facts when
# the role is called from a play with gather_facts: false.
- name: Gather distribution facts if not already collected
  ansible.builtin.setup:
    gather_subset: min
  when: ansible_distribution_major_version is undefined

- name: Warn that Enterprise Linux 9 support is deprecated
  ansible.builtin.debug:
    msg: >-
      DEPRECATION WARNING: this host runs Enterprise Linux
      {{ ansible_distribution_major_version }}. Support for Enterprise Linux 9
      is deprecated in maglo.qemu and will be removed in a future release.
      Plan an upgrade of the host to Enterprise Linux 10. Set
      host_el9_deprecation_warning to false to silence this message.
  when:
    - ansible_distribution_major_version | string == "9"
    - host_el9_deprecation_warning | bool
