---
- name: Install QEMU/KVM and related packages
  ansible.builtin.dnf:
    name: "{{ host_packages }}"
    state: present

- name: Enable and start libvirtd
  ansible.builtin.systemd_service:
    name: libvirtd
    enabled: "{{ host_libvirtd_enabled }}"
    state: "{{ 'started' if host_libvirtd_enabled else 'stopped' }}"

- name: Create VM config directory
  ansible.builtin.file:
    path: "{{ host_vm_config_dir }}"
    state: directory
    owner: "{{ host_service_user }}"
    group: "{{ host_service_group }}"
    mode: "0755"

- name: Create VM image directory
  ansible.builtin.file:
    path: "{{ host_vm_image_dir }}"
    state: directory
    owner: "{{ host_service_user }}"
    group: "{{ host_service_group }}"
    mode: "0755"
