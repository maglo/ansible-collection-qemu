---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # ── Packages ──────────────────────────────────────────────
    - name: Check QEMU/KVM packages are installed
      ansible.builtin.dnf:
        name: "{{ item }}"
        state: present
      check_mode: true
      register: pkg_check
      failed_when: pkg_check.changed
      loop:
        - qemu-kvm
        - qemu-img
        - swtpm
        - swtpm-tools

    # ── User and group ────────────────────────────────────────
    - name: Check qemu group exists
      ansible.builtin.group:
        name: qemu
        state: present
      check_mode: true
      register: group_check
      failed_when: group_check.changed

    - name: Check qemu user exists
      ansible.builtin.user:
        name: qemu
        state: present
      check_mode: true
      register: user_check
      failed_when: user_check.changed

    # ── Directories ───────────────────────────────────────────
    - name: Stat VM config directory
      ansible.builtin.stat:
        path: /etc/qemu/vms
      register: vm_config_dir

    - name: Assert VM config directory
      ansible.builtin.assert:
        that:
          - vm_config_dir.stat.exists
          - vm_config_dir.stat.isdir
          - vm_config_dir.stat.pw_name == 'qemu'
          - vm_config_dir.stat.gr_name == 'qemu'
          - vm_config_dir.stat.mode == '0755'

    - name: Stat VM image directory
      ansible.builtin.stat:
        path: /var/lib/qemu/images
      register: vm_image_dir

    - name: Assert VM image directory
      ansible.builtin.assert:
        that:
          - vm_image_dir.stat.exists
          - vm_image_dir.stat.isdir
          - vm_image_dir.stat.pw_name == 'qemu'
          - vm_image_dir.stat.gr_name == 'qemu'
          - vm_image_dir.stat.mode == '0755'

    # ── Systemd unit ──────────────────────────────────────────
    - name: Stat qemu-vm@ service unit
      ansible.builtin.stat:
        path: /etc/systemd/system/qemu-vm@.service
      register: qemu_vm_unit

    - name: Assert qemu-vm@ service unit file
      ansible.builtin.assert:
        that:
          - qemu_vm_unit.stat.exists
          - qemu_vm_unit.stat.pw_name == 'root'
          - qemu_vm_unit.stat.gr_name == 'root'
          - qemu_vm_unit.stat.mode == '0644'

    - name: Read qemu-vm@ service unit content
      ansible.builtin.slurp:
        src: /etc/systemd/system/qemu-vm@.service
      register: qemu_vm_unit_content

    - name: Assert qemu-vm@ service unit content
      vars:
        content: "{{ qemu_vm_unit_content.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'Ansible managed' in content"
          - "'User=qemu' in content"
          - "'Group=qemu' in content"
          # 0770 sockets, so a console service in the qemu group can attach.
          - "'UMask=0007' in content"
          - "'EnvironmentFile=/etc/qemu/vms/%i.conf' in content"
          - "'ExecStart=/usr/libexec/qemu-kvm $QEMU_ARGS' in content"

    - name: Stat swtpm@ service unit
      ansible.builtin.stat:
        path: /etc/systemd/system/swtpm@.service
      register: swtpm_unit

    - name: Assert swtpm@ service unit file
      ansible.builtin.assert:
        that:
          - swtpm_unit.stat.exists
          - swtpm_unit.stat.pw_name == 'root'
          - swtpm_unit.stat.gr_name == 'root'
          - swtpm_unit.stat.mode == '0644'

    - name: Read swtpm@ service unit content
      ansible.builtin.slurp:
        src: /etc/systemd/system/swtpm@.service
      register: swtpm_unit_content

    - name: Assert swtpm@ service unit content
      vars:
        content: "{{ swtpm_unit_content.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'Ansible managed' in content"
          - "'User=qemu' in content"
          - "'Group=qemu' in content"
          - "'Before=qemu-vm@%i.service' in content"
          - "'/usr/bin/swtpm socket' in content"
          - "'/var/lib/swtpm/%i' in content"

    # ── labview console service ───────────────────────────────
    # The host role installs and runs labview by default, so this
    # scenario covers it. The end-to-end assertion that it serves the
    # machine the vms role wrote lives in the vms `labview` scenario.
    - name: Read the labview account
      ansible.builtin.getent:
        database: passwd
        key: labview
      become: true

    - name: Assert the labview account
      vars:
        entry: "{{ ansible_facts.getent_passwd['labview'] }}"
      ansible.builtin.assert:
        that:
          # getent_passwd: [password, uid, gid, gecos, home, shell]
          - entry[4] == '/var/lib/labview'
          - entry[5] == '/sbin/nologin'
        fail_msg: "labview account is {{ entry }}"

    - name: Read the qemu group
      ansible.builtin.getent:
        database: group
        key: qemu
      become: true

    - name: Assert labview is a member of the qemu group
      ansible.builtin.assert:
        that:
          - "'labview' in ansible_facts.getent_group['qemu'][2].split(',')"
        fail_msg: >-
          labview is not in the qemu group, so it cannot open the serial and
          QMP sockets of a VM.

    # ── Binary ────────────────────────────────────────────────
    - name: Stat the labview binary
      ansible.builtin.stat:
        path: /usr/local/bin/labview
      register: binary

    - name: Assert the labview binary
      ansible.builtin.assert:
        that:
          - binary.stat.exists
          - binary.stat.pw_name == 'root'
          - binary.stat.mode == '0755'

    - name: Ask the binary for its version
      ansible.builtin.command: /usr/local/bin/labview -version
      register: version
      changed_when: false

    - name: Assert the installed version is the one the role pins
      ansible.builtin.assert:
        that:
          - version.stdout | trim == '0.2.0'
        fail_msg: "installed labview reports {{ version.stdout | trim }}"

    # ── Directories ───────────────────────────────────────────
    - name: Stat the labview directories
      ansible.builtin.stat:
        path: "{{ item }}"
      register: dirs
      loop:
        - /var/lib/labview
        - /var/lib/labview/recordings
        - /var/lib/labview/screenshots
        - /etc/labview/inventory.d

    - name: Assert the state and recordings directories
      ansible.builtin.assert:
        that:
          - item.stat.isdir
          - item.stat.pw_name == 'labview'
          - item.stat.gr_name == 'labview'
          - item.stat.mode == '0750'
      loop: "{{ dirs.results[0:2] }}"
      loop_control:
        label: "{{ item.item }}"

    # QEMU writes a frame here as its own user and labview reads it back, so
    # the group is qemu, it is group writable, and setgid keeps a new frame in
    # that group.
    #
    # `stat` formats the mode as %04o, so a directory with a special bit set
    # has that bit as its first digit and no leading zero: setgid 0770 reads
    # as 2770, where a plain 0750 reads as 0750.
    - name: Assert the screenshot directory is shared with QEMU
      vars:
        entry: "{{ dirs.results[2].stat }}"
      ansible.builtin.assert:
        that:
          - entry.isdir
          - entry.pw_name == 'labview'
          - entry.gr_name == 'qemu'
          - entry.mode == '2770'
          - entry.isgid
        fail_msg: "screenshot directory is {{ entry.pw_name }}:{{ entry.gr_name }} {{ entry.mode }}"

    # Both this role and the vms role create it, with the same owner and mode,
    # so neither fights the other.
    - name: Assert the inventory directory
      vars:
        entry: "{{ dirs.results[3].stat }}"
      ansible.builtin.assert:
        that:
          - entry.isdir
          - entry.pw_name == 'root'
          - entry.gr_name == 'root'
          - entry.mode == '0755'

    # ── systemd unit ──────────────────────────────────────────
    - name: Stat the labview unit
      ansible.builtin.stat:
        path: /etc/systemd/system/labview.service
      register: unit

    - name: Assert the labview unit file
      ansible.builtin.assert:
        that:
          - unit.stat.exists
          - unit.stat.pw_name == 'root'
          - unit.stat.mode == '0644'

    - name: Read the labview unit
      ansible.builtin.slurp:
        src: /etc/systemd/system/labview.service
      register: unit_content

    - name: Assert the labview unit content
      vars:
        content: "{{ unit_content.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'Ansible managed' in content"
          - "'User=labview' in content"
          - "'Group=labview' in content"
          # Without this labview cannot open a socket QEMU created.
          - "'SupplementaryGroups=qemu' in content"
          - "'-listen 127.0.0.1:8080' in content"
          - "'-inventory /etc/labview/inventory.d' in content"
          - "'-recordings-dir /var/lib/labview/recordings' in content"
          - "'-screenshot-dir /var/lib/labview/screenshots' in content"
          - "'-identity-header X-Forwarded-User' in content"
          - "'-host-access local' in content"
          # Hardening that the role must not lose: labview writes only under
          # its state directory, and ProcSubset has to stay permissive or the
          # details tab loses the QEMU command line.
          - "'ProtectSystem=strict' in content"
          - "'ReadWritePaths=/var/lib/labview' in content"
          - "'ProcSubset=all' in content"
          - "'NoNewPrivileges=yes' in content"

    # ── polkit rule ───────────────────────────────────────────
    - name: Stat the polkit rule
      ansible.builtin.stat:
        path: /etc/polkit-1/rules.d/50-labview-units.rules
      register: rule

    - name: Assert the polkit rule file
      ansible.builtin.assert:
        that:
          - rule.stat.exists
          - rule.stat.pw_name == 'root'
          - rule.stat.mode == '0644'

    - name: Read the polkit rule
      ansible.builtin.slurp:
        src: /etc/polkit-1/rules.d/50-labview-units.rules
      register: rule_content

    - name: Assert the polkit rule grants exactly what labview needs
      vars:
        content: "{{ rule_content.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'org.freedesktop.systemd1.manage-units' in content"
          - '''subject.user !== "labview"'' in content'
          # Narrowed to the units the vms role creates, not upstream's
          # deliberately wide pattern.
          - "'qemu-vm@[A-Za-z0-9._-]+' in content"
          - "'verb === \"start\"' in content"
          - "'verb === \"stop\"' in content"
          - "'verb === \"restart\"' in content"
          # Nothing else is labview's business, even on a unit it may restart.
          - "'\"mask\"' not in content"
          - "'\"enable\"' not in content"

    # ── The service, and what it serves ───────────────────────
    - name: Read the labview service state
      ansible.builtin.systemd_service:
        name: labview.service
      register: service
      become: true

    - name: Assert labview is enabled and running
      ansible.builtin.assert:
        that:
          - service.status.UnitFileState == 'enabled'
          - service.status.ActiveState == 'active'
        fail_msg: >-
          labview.service is {{ service.status.ActiveState }}
          ({{ service.status.SubState | default('') }}).

    # No VM exists in this scenario, so labview serves an empty lab. That it
    # answers at all is what proves the unit, the account and the directories
    # line up.
    - name: Ask labview for its machines
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/api/machines
        return_content: true
      register: machines
      retries: 5
      delay: 2
      until: machines is succeeded

    - name: Assert labview serves an empty lab
      ansible.builtin.assert:
        that:
          - machines.json.machines | length == 0
        fail_msg: "labview serves {{ machines.json.machines | default('?') }}"
