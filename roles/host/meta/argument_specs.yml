---
argument_specs:
  main:
    short_description: Install and configure a QEMU/KVM host on Enterprise Linux.
    description:
      - Installs the QEMU/KVM packages, deploys the C(qemu-vm@.service) and
        C(swtpm@.service) systemd template units, and installs a small SELinux
        policy module when SELinux is enforcing.
      - The per-VM instances of both units are managed by the C(vms) role.
    options:
      host_packages:
        description: Packages to install for QEMU/KVM host.
        type: list
        elements: str
        default:
          - qemu-kvm
          - qemu-img
          - swtpm
          - swtpm-tools
          - socat
          - genisoimage
          - edk2-ovmf
      host_vm_config_dir:
        description: >-
          Directory containing QEMU VM configuration files (one C(.conf) per VM).
          The template units read it, so it must match C(vms_vm_config_dir) of
          the C(vms) role.
        type: path
        default: /etc/qemu/vms
      host_vm_image_dir:
        description: >-
          Directory containing QEMU VM disk images. It must match
          C(vms_image_dir) of the C(vms) role.
        type: path
        default: /var/lib/qemu/images
      host_service_user:
        description: User for the QEMU systemd service.
        type: str
        default: qemu
      host_service_group:
        description: Group for the QEMU systemd service.
        type: str
        default: qemu
      host_vm_umask:
        description: >-
          Umask of the C(qemu-vm@.service) units. QEMU creates the serial and
          QMP sockets of a VM itself and never chmods them, so their mode is
          0777 minus this value. The default C(0007) leaves them at 0770,
          which a console service running in C(host_service_group) can
          connect to; systemd's own default of 0022 leaves them at 0755, which
          no group member can, because connecting to a UNIX socket needs the
          write bit.
        type: str
        default: "0007"
      host_labview_enabled:
        description: >-
          Whether to install and run the labview console service. It serves
          the framebuffer, serial line and control channel of every machine
          behind one port, reading the per-machine inventory the C(vms) role
          writes through C(vms_labview_inventory_dir). Set it to C(false) on a
          host that should not run it, for example one with no outbound
          network for the download.
        type: bool
        default: true
      host_labview_version:
        description: Release of labview to install.
        type: str
        default: "0.2.0"
      host_labview_arch:
        description: >-
          Architecture suffix of the release asset. When unset the role
          derives it from C(ansible_architecture): C(x86_64) gives C(amd64)
          and C(aarch64) gives C(arm64), and any other architecture fails the
          run rather than guessing.
        type: str
        default: null
      host_labview_binary_url:
        description: >-
          URL of the release asset. The default names the asset of
          C(host_labview_version) for the derived architecture.
        type: str
        default: https://github.com/maglo/qemu-lab-manager/releases/download/v{{ host_labview_version }}/labview-linux-{{ _host_labview_arch }}
      host_labview_checksum:
        description: >-
          Checksum of the asset, in the form C(ansible.builtin.get_url) takes.
          The default points at the C(SHA256SUMS) of the same release, which
          C(get_url) fetches and matches by the basename of
          C(host_labview_binary_url). Pin a literal C(sha256:<digest>) to avoid
          trusting a file served beside the binary. Setting it to C(null)
          downloads without verifying anything.
        type: str
        default: sha256:https://github.com/maglo/qemu-lab-manager/releases/download/v{{ host_labview_version }}/SHA256SUMS
      host_labview_binary_path:
        description: Where the binary is installed.
        type: path
        default: /usr/local/bin/labview
      host_labview_user:
        description: >-
          Service account labview runs as. polkit matches the subject by user
          name, so this must be a real host account. Never C(root): systemd
          short-circuits the privilege check for a root caller, so the polkit
          rule would bound nothing.
        type: str
        default: labview
      host_labview_group:
        description: Primary group of the service account.
        type: str
        default: labview
      host_labview_qemu_group:
        description: >-
          Group of the QEMU serial and QMP sockets, joined as a supplementary
          group so labview can open them. It must match C(host_service_group)
          of the C(host) role, whose C(host_vm_umask) has to leave the sockets
          group writable.
        type: str
        default: "{{ host_service_group }}"
      host_labview_state_dir:
        description: Base directory for everything labview writes.
        type: path
        default: /var/lib/labview
      host_labview_recordings_dir:
        description: >-
          Directory for the serial transcripts, one per machine per run. This
          is where guest boot output lives now that it no longer reaches the
          journal of C(qemu-vm@<name>.service).
        type: path
        default: "{{ host_labview_state_dir }}/recordings"
      host_labview_screenshot_dir:
        description: >-
          Directory shared with QEMU for screenshots. QEMU writes a frame here
          over QMP and labview reads it and removes it again, so the role
          creates it setgid to C(host_labview_qemu_group).
        type: path
        default: "{{ host_labview_state_dir }}/screenshots"
      host_labview_inventory_dir:
        description: >-
          Directory of per-machine inventory files. It must match
          C(vms_labview_inventory_dir) of the C(vms) role, which writes one
          file per VM.
        type: path
        default: /etc/labview/inventory.d
      host_labview_listen:
        description: >-
          Address and port labview serves on. Loopback by default: labview
          authenticates nobody, so anyone who can reach this address holds the
          write lease of every machine. The role warns when it is not
          loopback.
        type: str
        default: 127.0.0.1:8080
      host_labview_host_access:
        description: >-
          Host introspection mode. C(local) reads C(/proc) for the QEMU
          command line of a machine, which is what the details tab shows.
        type: str
        default: local
        choices:
          - local
          - none
          - fake
      host_labview_identity_header:
        description: >-
          Request header carrying the identity a proxy has authenticated.
          labview trusts it completely, so the proxy must set it and must
          discard whatever the client sent.
        type: str
        default: X-Forwarded-User
      host_labview_extra_args:
        description: >-
          Extra command line arguments, appended to C(ExecStart) verbatim. For
          settings the role does not model, such as C(-lease-idle) or
          C(-tile-mode).
        type: list
        elements: str
        default: []
      host_labview_polkit_rule_path:
        description: >-
          Where the polkit rule is installed. The rule is mandatory: a system
          service has no logind session, so without it polkit falls through to
          C(auth_admin), finds no agent to answer, and every power operation
          fails.
        type: path
        default: /etc/polkit-1/rules.d/50-labview-units.rules
      host_labview_unit_pattern:
        description: >-
          Units labview may start, stop and restart, as a JavaScript regular
          expression. The default matches the units the C(vms) role creates
          and nothing else. Narrow it further to bound labview to part of a
          hypervisor.
        type: str
        default: ^qemu-vm@[A-Za-z0-9._-]+\.service$
      host_labview_service_state:
        description: State to leave C(labview.service) in.
        type: str
        default: started
        choices:
          - started
          - stopped
      host_swtpm_state_dir:
        description: >-
          Base directory for the per-VM swtpm state directories. The
          C(swtpm@.service) template unit reads it, so it must match
          C(vms_swtpm_state_dir) of the C(vms) role.
        type: path
        default: /var/lib/swtpm
