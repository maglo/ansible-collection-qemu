---
- name: Converge
  hosts: all
  roles:
    - role: host
      host_novnc_enabled: true
    - role: vms
      vms_list:
        - name: web01
          disk_size: 1G
          novnc_enabled: true
          novnc_port: 6080
          vnc: 0
          state: present
        - name: db01
          disk_size: 1G
          novnc_enabled: true
          # Test auto-port assignment (should be 6080 + vnc display number)
          vnc: 1
          state: present
        - name: app01
          disk_size: 1G
          # Test VM without noVNC
          state: present
