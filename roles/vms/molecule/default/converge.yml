---
- name: Converge
  hosts: all
  pre_tasks:
    - name: Create test USB installer image
      ansible.builtin.copy:
        dest: /tmp/test-usb-installer.iso
        content: "molecule-usb-test\n"
        mode: "0644"
  roles:
    - role: vms
      vms_list:
        - name: testvm
          disk_size: 1G
          uefi: true
          state: present
        - name: testvm-tpm
          disk_size: 1G
          tpm: true
          state: present
        - name: testvm-bridge
          disk_size: 1G
          uefi: false
          net_mode: bridge
          net_bridge: br-test
          memory: 4G
          cpus: 4
          vnc: 10
          state: present
        - name: testvm-mac
          disk_size: 1G
          uefi: false
          net_mode: user
          mac_address: "52:54:00:aa:bb:cc"
          state: present
        - name: testvm-usb
          disk_size: 1G
          usb_disk_image: /tmp/test-usb-installer.iso
          state: present
        - name: testvm-usb-noboot
          disk_size: 1G
          usb_disk_image: /tmp/test-usb-installer.iso
          usb_boot_priority: false
          state: present
