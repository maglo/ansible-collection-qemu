---
driver:
  name: ${DRIVER:-docker}
platforms:
  - name: create-vm-default
    image: "geerlingguy/docker-rockylinux${EL_VERSION:-9}-ansible:latest"
    command: ""
    privileged: true
    pre_build_image: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    tmpfs:
      - /run
      - /tmp
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
  config_options:
    defaults:
      # Docker containers run as root; su works reliably root→root without
      # PAM account management, whereas sudo may fail in minimal containers.
      become_method: su
verifier:
  name: ansible
