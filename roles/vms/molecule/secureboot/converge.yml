---
- name: Converge
  hosts: all
  roles:
    - role: host
    - role: vms
      vms_list:
        # Stock template, selected by the secure_boot flag.
        - name: sb-stock
          disk_size: 1G
          secure_boot: true
          state: present
        # Per-VM template. It must not change what sb-stock gets.
        - name: sb-custom
          disk_size: 1G
          secure_boot: true
          nvram_template: /tmp/custom_VARS.fd
          state: present
        # A store with known keys, used by the verification in verify.yml.
        - name: sb-enrolled
          disk_size: 1G
          secure_boot: true
          nvram_template: /tmp/enrolled_VARS.fd
          state: present
        # A VM of an earlier collection version. Its NVRAM file must survive.
        - name: legacyvm
          disk_size: 1G
          secure_boot: true
          state: present
