---
driver:
  name: ${DRIVER:-docker}
platforms:
  - name: create-vm-lifecycle
    image: "geerlingguy/docker-rockylinux${EL_VERSION:-9}-ansible:latest"
    command: ""
    privileged: true
    pre_build_image: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    tmpfs:
      - /run
      - /tmp
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
    # Docker containers run as root; su works reliably root→root without
    # PAM account management, whereas sudo may fail in minimal containers.
    ANSIBLE_BECOME_METHOD: su
verifier:
  name: ansible
# The default sequence, without `idempotence`.
#
# This scenario cannot be idempotent, by construction. Its converge creates
# `lifecycle-test-tpm` and then destroys it, so a second converge recreates the
# disk image, the swtpm state and the drop-in, and destroys them again. That is
# the behaviour under test, not a defect: `state: absent` is meant to change
# the host.
#
# Nothing else is dropped. `side_effect` runs the destroy-only teardown of
# `lifecycle-test-solo`, in its own ansible-playbook so that no fact of the
# converge carries into it, and `verify` asserts that both destroyed VMs are
# gone and that the VM whose destroy was refused survived. The scenarios that
# converge to a steady state — default, secureboot, novnc, and both host
# scenarios — keep the idempotence check.
scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - side_effect
    - verify
    - cleanup
    - destroy
