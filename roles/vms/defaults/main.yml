---
# List of VMs to create. Each entry is a dict with at least a `name` key.
# Example:
#   vms_list:
#     - name: myvm
#       disk_size: 20G
#       disk_format: qcow2
#       usb_disk_image: /var/lib/qemu/images/installer.iso
#       usb_boot_priority: true
vms_list: []

# Default disk size for VMs (used when a VM does not specify disk_size)
vms_default_disk_size: "20G"

# Default disk format
vms_default_disk_format: qcow2

# Default disk bus for VMs (per-VM override with `disk_bus` key).
# `virtio-blk` attaches the disk with `-drive if=virtio`.
# `virtio-scsi` attaches a virtio-scsi-pci controller and an scsi-hd device,
# which is the bus that production images usually use.
vms_default_disk_bus: virtio-blk

# Directory for VM disk images (must match host_vm_image_dir)
vms_image_dir: /var/lib/qemu/images

# Cache directory for downloaded disk images (shared across VMs)
vms_image_cache_dir: /var/lib/qemu/images/cache

# Whether to verify checksums for downloaded images
vms_verify_checksums: true

# Owner/group for created images
vms_service_user: qemu
vms_service_group: qemu

# Whether VMs default to UEFI boot (can be overridden per VM with `uefi` key)
vms_default_uefi: true

# Path to OVMF firmware code (read-only, shared across VMs).
# Defaults to the correct path for the detected OS major version (see vars/main.yml).
# Override this variable if your firmware is installed in a non-standard location.
vms_ovmf_code: "{{ _vms_ovmf_path_map[(ansible_distribution_major_version | default('9')) | string]['code'] }}"

# Path to OVMF vars template (copied per-VM for writable NVRAM).
# Defaults to the correct path for the detected OS major version (see vars/main.yml).
# Override this variable if your firmware is installed in a non-standard location.
vms_ovmf_vars_template: "{{ _vms_ovmf_path_map[(ansible_distribution_major_version | default('9')) | string]['vars'] }}"

# Whether VMs default to UEFI Secure Boot (per-VM override with `secure_boot` key)
vms_default_secure_boot: false

# Path to OVMF Secure Boot firmware code (read-only, shared across VMs)
vms_ovmf_code_secboot: /usr/share/edk2/ovmf/OVMF_CODE.secboot.fd

# Path to OVMF Secure Boot vars template (pre-enrolled Microsoft/OVMF keys, copied per-VM)
vms_ovmf_vars_secboot_template: /usr/share/edk2/ovmf/OVMF_VARS.secboot.fd

# Force a rewrite of the UEFI NVRAM file of every VM in this run.
# This variable is a one-shot escape hatch for the command line:
#   ansible-playbook ... -e vms_nvram_force_reset=true
# Do not set it in a playbook. It erases the UEFI boot entries at each run.
# To reset the NVRAM of one VM, increase its `nvram_generation` key instead.
vms_nvram_force_reset: false

# Whether VMs default to TPM 2.0 emulation (per-VM override with `tpm` key)
vms_default_tpm: false

# Clear the swtpm state of every TPM VM in this run.
# This variable is a one-shot escape hatch for the command line:
#   ansible-playbook ... -e vms_tpm_force_reset=true
# Do not set it in a playbook. It clears sealed key slots, persistent handles
# and the PCR history at each run.
# To reset the TPM of one VM, increase its `tpm_generation` key instead.
vms_tpm_force_reset: false

# Base directory for per-VM swtpm state
# NOTE: This must match host_swtpm_state_dir (used by swtpm@.service template)
vms_swtpm_state_dir: /var/lib/swtpm

# Default networking mode for VMs (user or bridge)
vms_default_net_mode: user

# Default bridge device for bridge-mode networking
vms_default_net_bridge: br0

# Path to QEMU bridge helper ACL file
vms_bridge_conf: /etc/qemu/bridge.conf

# Directory for per-VM QEMU configuration files
vms_vm_config_dir: /etc/qemu/vms

# Default memory allocation for VMs (used when a VM does not specify memory)
vms_default_memory: 2G

# Default number of virtual CPUs (used when a VM does not specify cpus)
vms_default_cpus: 2

# Default CPU model passed to QEMU -cpu flag (used when a VM does not specify cpu_model)
vms_default_cpu: host

# Whether VMs default to noVNC web console (per-VM override with `novnc_enabled` key)
vms_default_novnc_enabled: false

# Default noVNC port (null means auto-assign: 6080 + VNC display number)
vms_default_novnc_port: null

# Default shutdown timeout for graceful ACPI powerdown (seconds)
vms_default_shutdown_timeout: 120
