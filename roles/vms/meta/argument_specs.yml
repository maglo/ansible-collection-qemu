---
argument_specs:
  main:
    short_description: Create and manage QEMU/KVM virtual machines.
    description:
      - Creates the disk image, the UEFI variable store, the emulated TPM state,
        the cloud-init seed ISO and the noVNC proxy of each VM in C(vms_list),
        writes the QEMU arguments of the VM to
        C(vms_vm_config_dir/<name>.conf), and brings the
        C(qemu-vm@<name>) service to the state that the VM asks for.
      - "Prerequisite: apply C(maglo.qemu.host) first (or provide an equivalent
        host setup), so that the QEMU binaries, the systemd template units and
        the directories already exist."
      - >-
        A configuration change is written to the C(.conf) file but does not
        restart a running VM. Use C(state: restarted) to apply it now.
    options:
      vms_list:
        description:
          - List of VMs to create. Each entry is a dictionary with at least a C(name) key.
          - "Optional per-VM keys: C(disk_size) (overrides C(vms_default_disk_size)),
            C(disk_format) (overrides C(vms_default_disk_format)),
            C(disk_bus) (overrides C(vms_default_disk_bus)),
            C(disk_image_url) (URL to qcow2 image to use as backing file),
            C(disk_image_checksum) (SHA256 checksum for image verification),
            C(uefi) (overrides C(vms_default_uefi)),
            C(secure_boot) (overrides C(vms_default_secure_boot)),
            C(nvram_template) (per-VM UEFI variable store template),
            C(nvram_generation) (increase to write the NVRAM file again),
            C(nvram_expected_db_cn) (subject CN that the db must hold),
            C(tpm) (overrides C(vms_default_tpm)),
            C(tpm_generation) (increase to clear the TPM state),
            C(net_mode) (overrides C(vms_default_net_mode)),
            C(net_bridge) (overrides C(vms_default_net_bridge)),
            C(mac_address) (overrides the auto-generated MAC),
            C(memory) (overrides C(vms_default_memory)),
            C(cpus) (overrides C(vms_default_cpus)),
            C(cpu_model) (overrides C(vms_default_cpu)),
            C(vnc) (VNC display number, auto-generated from VM name if not specified),
            C(vnc_address) (address that the VNC console binds),
            C(serial_socket) (path of the serial console socket),
            C(qmp_socket) (path of the QMP socket),
            C(smbios_oem_strings) (list of SMBIOS type 11 OEM strings),
            C(usb_disk_image) (path to USB disk image: iso/raw/img/qcow2),
            C(usb_boot_priority) (boot from attached USB first; defaults to true when usb image is set),
            C(cloud_init_user_data) (cloud-init user-data content; triggers seed ISO generation),
            C(cloud_init_meta_data) (cloud-init meta-data content; auto-generated from VM name if omitted),
            C(cloud_init_network_config) (cloud-init network-config content; omitted from ISO if not set),
            C(novnc_enabled) (enable noVNC web console for this VM),
            C(novnc_port) (noVNC port, auto-assigned if not specified),
            C(state) (C(present), C(started), C(stopped), C(restarted) or C(absent)),
            C(force_destroy) (required by C(state: absent)),
            C(shutdown_timeout) (seconds to wait for the guest to power down)."
        type: list
        elements: dict
        default: []
        options:
          name:
            description: Name of the VM. Used as the disk image filename.
            type: str
            required: true
          disk_size:
            description: Disk image size (e.g. C(20G), C(100G)). Overrides C(vms_default_disk_size).
            type: str
          disk_format:
            description: Disk image format. Overrides C(vms_default_disk_format).
            type: str
            choices:
              - qcow2
              - raw
          disk_bus:
            description: >-
              Bus for the system disk of this VM. Overrides C(vms_default_disk_bus).
              C(virtio-blk) attaches the disk with C(-drive if=virtio).
              C(virtio-scsi) attaches a C(virtio-scsi-pci) controller and an
              C(scsi-hd) device, which is the bus that production images usually use.
              The cloud-init seed ISO stays on virtio-blk in both cases.
            type: str
            choices:
              - virtio-blk
              - virtio-scsi
          disk_image_url:
            description: >-
              URL to a qcow2 disk image to download and use as a backing file.
              When specified, creates an overlay image instead of a blank disk.
              The downloaded image is cached in C(vms_image_cache_dir).
            type: str
          disk_image_checksum:
            description: >-
              SHA256 checksum for the downloaded image (format: C(sha256:abc123...)).
              When specified with C(disk_image_url), verifies the downloaded file.
              Download fails if checksum doesn't match.
            type: str
          uefi:
            description: Whether to enable UEFI boot for this VM. Overrides C(vms_default_uefi).
            type: bool
          secure_boot:
            description: >-
              Enable UEFI Secure Boot for this VM. Overrides C(vms_default_secure_boot).
              Uses C(OVMF_CODE.secboot.fd) with pre-enrolled Microsoft/OVMF keys and enables
              SMM (System Management Mode). Requires UEFI to be enabled.
            type: bool
          nvram_template:
            description: >-
              Path to the UEFI variable store template for this VM.
              It overrides C(vms_ovmf_vars_template) and C(vms_ovmf_vars_secboot_template)
              for this VM only. Use it to give one VM a variable store that holds
              custom PK, KEK and db keys.
            type: path
          nvram_generation:
            description: >-
              Generation counter for the UEFI variable store of this VM.
              Increase the value to make the role write the NVRAM file again from the
              template. The role writes the file again also when C(secure_boot), the
              template path, or the content of the template changes.
              A rewrite erases the UEFI boot entries of the VM.
            type: int
            default: 1
          nvram_expected_db_cn:
            description: >-
              Subject common name of a certificate that the signature database (db)
              of this VM must hold, for example C(My Devbox Secure Boot).
              The role checks it only when C(vms_nvram_verify) is C(true).
            type: str
          tpm:
            description: Enable TPM 2.0 emulation for this VM via swtpm. Overrides C(vms_default_tpm).
            type: bool
          tpm_generation:
            description: >-
              Generation counter for the TPM state of this VM.
              Increase the value to clear C(vms_swtpm_state_dir/<name>).
              A reset removes the sealed key slots, the persistent handles and
              the PCR history of the VM. The role stops the VM and swtpm before
              it clears the directory, and starts them again afterwards.
              Only an increase resets. Lowering the value, or removing the key
              so that it falls back to C(1), leaves the TPM alone.
            type: int
            default: 1
          net_mode:
            description: Networking mode for this VM. Overrides C(vms_default_net_mode).
            type: str
            choices:
              - user
              - bridge
          net_bridge:
            description: Bridge device for this VM. Overrides C(vms_default_net_bridge).
            type: str
          mac_address:
            description: >-
              MAC address for this VM. It overrides the address that the role
              derives from a hash of the VM name. Two names can give the same
              address; the role then fails the run and asks for an explicit value.
            type: str
          memory:
            description: Memory allocation for this VM (e.g. C(2G), C(4G)). Overrides C(vms_default_memory).
            type: str
          cpus:
            description: Number of virtual CPUs for this VM. Overrides C(vms_default_cpus).
            type: int
          cpu_model:
            description: >-
              CPU model for this VM (e.g. C(host), C(kvm64)).
              Overrides C(vms_default_cpu).
            type: str
          vnc:
            description: >-
              VNC display number for this VM (it maps to port 5900+N).
              When it is not set, the role derives it from a hash of the VM name.
              Two names can give the same number; the role then fails the run
              and asks for an explicit value.
            type: int
          vnc_address:
            description:
              - >-
                Address that the VNC console of this VM binds.
                Overrides C(vms_default_vnc_address).
              - >-
                An empty string binds every interface. C(127.0.0.1) reaches the
                console through the host only, which suits a console service
                that proxies it. Wrap an IPv6 address in brackets, for example
                C([::1]).
              - >-
                The noVNC instance of a VM connects to C(localhost), so it
                keeps working with a loopback address.
            type: str
          serial_socket:
            description:
              - >-
                Path of the UNIX socket that carries the guest serial console.
                Overrides C(vms_default_serial_socket).
              - >-
                When neither is set, the VM gets
                C(/var/lib/qemu/<name>/serial.sock). The role creates that
                directory. A path anywhere else needs a directory that the
                deployer creates and that the QEMU user can write.
              - >-
                The path may not hold a space, because systemd splits
                C($QEMU_ARGS) at each space.
            type: str
          qmp_socket:
            description:
              - >-
                Path of the QMP control socket of this VM.
                Overrides C(vms_default_qmp_socket).
              - >-
                When neither is set, the VM gets
                C(/var/lib/qemu/<name>/qmp.sock). QMP is the whole control
                channel of a VM: it is machine readable, it carries typed
                commands such as C(send-key) and C(screendump), and the role
                sends C(system_powerdown) over it on a graceful shutdown.
              - >-
                A VM has no C(-monitor) socket. QMP carries every human monitor
                command through C(human-monitor-command), so the monitor
                vocabulary is reachable here.
              - >-
                The same directory rule and space rule as C(serial_socket)
                apply.
            type: str
          smbios_oem_strings:
            description:
              - List of SMBIOS type 11 OEM strings for this VM.
              - >-
                C(systemd-stub) reads these strings, so they add to the command line
                of a UKI without a rebuild of the image, for example
                C(io.systemd.stub.kernel-cmdline-extra=rd.debug) or
                C(io.systemd.credential:mycred=abc).
              - >-
                The role writes each string to its own file under
                C(/var/lib/qemu/<name>/smbios/) and passes it to QEMU with
                C(-smbios type=11,path=...). A string may therefore contain spaces.
              - >-
                The files have mode C(0600) and belong to C(vms_service_user), because
                an OEM string can hold a secret. Deleting the key removes the files.
              - >-
                The firmware reads the strings once at boot. A change therefore takes
                effect at the next start of the VM, and the role does not restart a
                running VM.
              - >-
                C(systemd-stub) ignores these strings under confidential computing,
                and they measure into PCR 12. OpenStack Nova has no equivalent knob,
                so do not design a production configuration on this feature.
            type: list
            elements: str
          usb_disk_image:
            description: >-
              Path to a pre-provisioned USB disk image to attach to the VM.
              Supported formats: C(.iso), C(.raw), C(.img), C(.qcow2).
            type: path
          usb_boot_priority:
            description: >-
              Whether to boot from attached USB storage first.
              Defaults to C(true) when C(usb_disk_image) is set.
            type: bool
          cloud_init_user_data:
            description: >-
              Content for the cloud-init C(user-data) file (cloud-config YAML or shell script).
              When any C(cloud_init_*) key is set the role generates a seed ISO at
              C(vms_image_dir/<name>-seed.iso) and attaches it to the VM as a virtio CD-ROM.
              Requires C(genisoimage) on the host; the C(host) role installs it.
              The guest image must have C(cloud-init) or C(cloudbase-init) installed.
            type: str
          cloud_init_meta_data:
            description: >-
              Content for the cloud-init C(meta-data) file.
              When omitted, a minimal C(meta-data) with C(instance-id) and C(local-hostname)
              set to the VM name is generated automatically.
            type: str
          cloud_init_network_config:
            description: >-
              Content for the cloud-init C(network-config) file (Netplan or cloud-init v1/v2 format).
              When omitted, no C(network-config) file is included in the seed ISO.
            type: str
          novnc_enabled:
            description: >-
              Enable noVNC web console for this VM. Overrides C(vms_default_novnc_enabled).
              Requires novnc package to be installed (via host role with host_novnc_enabled: true).
            type: bool
          novnc_port:
            description: >-
              Port number for the noVNC web console.
              If not specified, auto-assigned as 6080 + VNC display number.
            type: int
          state:
            description:
              - >-
                Desired state of the C(qemu-vm@<name>) service.
                C(started) enables and starts it, C(stopped) enables but stops it,
                C(present) writes the config and leaves the service alone,
                C(restarted) shuts the guest down over QMP and starts
                it again, C(absent) destroys the VM and every artifact of it.
              - >-
                C(present) does not stop the swtpm and noVNC instances of the VM:
                the role starts those whenever C(tpm) or C(novnc_enabled) is on,
                so that the VM can be started by hand afterwards.
            type: str
            choices:
              - started
              - stopped
              - present
              - restarted
              - absent
          force_destroy:
            description: >-
              Safety flag required to destroy a VM with C(state: absent).
              Must be explicitly set to C(true) to prevent accidental data loss.
            type: bool
            default: false
          shutdown_timeout:
            description: >-
              Timeout in seconds to wait for graceful ACPI shutdown before forcing stop.
              Used by C(state: restarted) and C(state: absent).
              The role waits only when QEMU acknowledges the QMP command.
            type: int
            default: 120
      vms_default_disk_size:
        description: Default disk size for VMs that do not specify C(disk_size).
        type: str
        default: "20G"
      vms_default_disk_format:
        description: Default disk image format.
        type: str
        default: qcow2
        choices:
          - qcow2
          - raw
      vms_default_disk_bus:
        description: >-
          Default bus for the system disk of a VM.
          Can be overridden per VM with the C(disk_bus) key.
        type: str
        default: virtio-blk
        choices:
          - virtio-blk
          - virtio-scsi
      vms_image_dir:
        description: Directory for VM disk images. Should match C(host_vm_image_dir).
        type: path
        default: /var/lib/qemu/images
      vms_image_cache_dir:
        description: >-
          Directory for caching downloaded disk images.
          Images are shared across VMs and used as backing files.
        type: path
        default: /var/lib/qemu/images/cache
      vms_verify_checksums:
        description: >-
          Whether to compare the per-VM C(disk_image_checksum) against the
          downloaded image. Set it to C(false) only for a mirror that
          publishes no checksum. A VM that sets no C(disk_image_checksum) is
          not verified either way.
        type: bool
        default: true
      vms_service_user:
        description: Owner of the created disk image files.
        type: str
        default: qemu
      vms_service_group:
        description: Group of the created disk image files.
        type: str
        default: qemu
      vms_default_uefi:
        description: Whether VMs default to UEFI boot when not specified per-VM.
        type: bool
        default: true
      vms_ovmf_code:
        description: >-
          Path to the OVMF firmware code file (read-only, shared across VMs).
          Override this variable if your firmware is installed in a non-standard location.
        type: path
        default: /usr/share/edk2/ovmf/OVMF_CODE.fd
      vms_ovmf_vars_template:
        description: >-
          Path to the OVMF vars template file (copied per-VM for writable NVRAM).
          Override this variable if your firmware is installed in a non-standard location.
        type: path
        default: /usr/share/edk2/ovmf/OVMF_VARS.fd
      vms_default_secure_boot:
        description: >-
          Whether VMs default to UEFI Secure Boot when not specified per-VM.
          Uses Secure Boot firmware with pre-enrolled Microsoft/OVMF keys.
        type: bool
        default: false
      vms_ovmf_code_secboot:
        description: >-
          Path to the OVMF Secure Boot firmware code file (read-only, shared across VMs).
        type: path
        default: /usr/share/edk2/ovmf/OVMF_CODE.secboot.fd
      vms_ovmf_vars_secboot_template:
        description: >-
          Path to the OVMF Secure Boot vars template file with pre-enrolled keys
          (copied per-VM for writable NVRAM).
        type: path
        default: /usr/share/edk2/ovmf/OVMF_VARS.secboot.fd
      vms_nvram_verify:
        description:
          - >-
            Verify the UEFI variable store of each Secure Boot VM after the role
            writes it. The role asserts that a PK, a KEK and a db are enrolled, and
            that C(SecureBootEnable) is on.
          - >-
            A store without a PK is in Setup Mode, and a VM with such a store boots
            an unsigned artifact without a complaint.
          - >-
            C(SecureBoot) and C(SetupMode) are volatile variables that the firmware
            creates at boot, so an offline check cannot read them. An enrolled PK is
            the offline equivalent of C(SetupMode=0).
          - >-
            The check needs C(virt-fw-vars) from the package
            C(python3-virt-firmware), which is in EPEL. The role reports a
            skip when the command is absent.
        type: bool
        default: false
      vms_nvram_force_reset:
        description: >-
          Write the UEFI NVRAM file of every VM in this run again from its template.
          This variable is a one-shot escape hatch for the command line.
          Do not set it in a playbook, because it erases the UEFI boot entries at
          each run. To reset the NVRAM of one VM, increase its C(nvram_generation).
        type: bool
        default: false
      vms_default_tpm:
        description: Whether VMs default to TPM 2.0 emulation. Can be overridden per VM with C(tpm) key.
        type: bool
        default: false
      vms_tpm_force_reset:
        description: >-
          Clear the swtpm state of every TPM VM in this run.
          This variable is a one-shot escape hatch for the command line.
          Do not set it in a playbook. To reset the TPM of one VM, increase its
          C(tpm_generation).
        type: bool
        default: false
      vms_swtpm_state_dir:
        description: Base directory for per-VM swtpm state directories.
        type: path
        default: /var/lib/swtpm
      vms_default_net_mode:
        description: Default networking mode for VMs that do not specify C(net_mode).
        type: str
        default: user
        choices:
          - user
          - bridge
      vms_default_net_bridge:
        description: Default bridge device for bridge-mode VMs that do not specify C(net_bridge).
        type: str
        default: br0
      vms_bridge_conf:
        description: Path to the QEMU bridge helper ACL file.
        type: path
        default: /etc/qemu/bridge.conf
      vms_vm_config_dir:
        description: Directory for per-VM QEMU configuration files.
        type: path
        default: /etc/qemu/vms
      vms_default_memory:
        description: Default memory allocation for VMs that do not specify C(memory).
        type: str
        default: "2G"
      vms_default_cpus:
        description: Default number of virtual CPUs for VMs that do not specify C(cpus).
        type: int
        default: 2
      vms_default_cpu:
        description: Default CPU model passed to QEMU C(-cpu) flag for VMs that do not specify C(cpu_model).
        type: str
        default: host
      vms_default_novnc_enabled:
        description: >-
          Whether VMs default to noVNC web console when not specified per-VM.
          Requires novnc package to be installed (via host role).
        type: bool
        default: false
      vms_default_novnc_port:
        description: >-
          Default noVNC port for VMs that do not specify C(novnc_port).
          When it is null, each VM gets 6080 plus its own VNC display number.
          A fixed value gives every VM the same port, so it suits a host with
          one noVNC VM only; the role fails the run when two VMs would share
          a port.
        type: int
      vms_default_shutdown_timeout:
        description: >-
          Default timeout in seconds for graceful ACPI shutdown before forcing stop.
          Used when VMs do not specify C(shutdown_timeout).
        type: int
        default: 120
      vms_default_vnc_address:
        description:
          - >-
            Default address that the VNC console binds for VMs that do not
            specify C(vnc_address).
          - >-
            Loopback, so the console of a VM is reachable through the host
            only. Reach it through a console service or an SSH tunnel.
          - >-
            An empty string binds every interface, which is what QEMU does for
            C(-vnc :N) and what releases before 0.6.0 did.
          - >-
            Wrap an IPv6 address in brackets, for example C([::1]).
        type: str
        default: "127.0.0.1"
      vms_default_serial_socket:
        description:
          - >-
            Default path of the serial console socket for VMs that do not
            specify C(serial_socket).
          - >-
            When it is null, each VM gets
            C(/var/lib/qemu/<name>/serial.sock). A fixed value gives every VM
            the same path, so it suits a host with one VM only; the role fails
            the run when two VMs would share a socket.
        type: str
      vms_default_qmp_socket:
        description:
          - >-
            Default path of the QMP socket for VMs that do not specify
            C(qmp_socket).
          - >-
            When it is null, each VM gets C(/var/lib/qemu/<name>/qmp.sock).
            The role fails the run when two VMs would share a socket.
        type: str
      vms_labview_inventory_dir:
        description:
          - >-
            Directory that holds the per-machine inventory files of a console
            service such as
            C(labview) (U(https://github.com/maglo/qemu-lab-manager)), for
            example C(/etc/labview/inventory.d).
          - >-
            When it is null the role writes no inventory file and behaves as
            every earlier release did. When it is set, the role creates the
            directory and writes C(<dir>/<name>.yml) for each VM that is not
            C(absent), holding the C(name), C(host), C(vnc), C(serial),
            C(control) and C(unit) of the VM. C(state: absent) removes that
            file again.
          - >-
            The console service takes the machine id from the file name, so
            one VM is one file and there is no shared file to serialise.
          - >-
            A teardown run has to set this variable too. The removal in
            C(destroy.yml) cannot know the directory otherwise, so a
            C(state: absent) run that leaves it unset destroys the VM and
            leaves its inventory file behind.
        type: path
