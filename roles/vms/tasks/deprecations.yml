---
# Deprecation notices for the vms role.
#
# The default of `vms_default_vnc_address` is an empty string, which binds the
# VNC console of every VM on every interface. The next release changes that
# default to 127.0.0.1. When it does, delete this file, its import in
# main.yml, the vms_vnc_address_deprecation_warning default and its argument
# spec.

- name: Warn that the default VNC bind address changes
  ansible.builtin.debug:
    msg: >-
      DEPRECATION WARNING: these VMs leave vnc_address unset:
      {{ _vms_inherited_vnc_address | join(', ') }}. Their VNC console binds
      every interface today, and the next release changes the default of
      vms_default_vnc_address to 127.0.0.1. Set vnc_address per VM, or set
      vms_default_vnc_address, to choose the address yourself. Set
      vms_vnc_address_deprecation_warning to false to silence this message.
  when:
    - _vms_inherited_vnc_address | length > 0
    - not vms_default_vnc_address
    - vms_vnc_address_deprecation_warning | bool
