---
# Restart one VM. `item` is the resolved VM entry, set by service.yml.
#
# The VM goes down through the guest, not through SIGTERM, so a restart does
# not leave the guest file systems dirty. swtpm is cycled after the VM is
# down, because the drop-in unit makes the VM require it: stopping it first
# would take the VM down without a guest shutdown.

- name: Gracefully shut down {{ item.name }}
  ansible.builtin.include_tasks: shutdown.yml

- name: Restart swtpm service for {{ item.name }}
  ansible.builtin.systemd_service:
    name: "swtpm@{{ item.name }}.service"
    state: restarted
  become: true
  when: item.tpm

- name: Start VM service for {{ item.name }}
  ansible.builtin.systemd_service:
    name: "qemu-vm@{{ item.name }}.service"
    state: started
    daemon_reload: true
  become: true
