---
# Give every noVNC VM a websocket proxy in front of its VNC console.
# The `novnc@.service` template unit itself comes from the host role.

- name: Verify noVNC systemd template exists
  ansible.builtin.stat:
    path: /etc/systemd/system/novnc@.service
  register: _vms_novnc_template
  failed_when: not _vms_novnc_template.stat.exists

- name: Create systemd drop-in directory for {{ item.name }}
  ansible.builtin.file:
    path: "/etc/systemd/system/qemu-vm@{{ item.name }}.service.d"
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true
  loop: "{{ _vms_novnc_vms }}"
  loop_control:
    label: "{{ item.name }}"

- name: Deploy noVNC dependency override for {{ item.name }}
  ansible.builtin.template:
    src: qemu-vm-novnc-dependency.conf.j2
    dest: "/etc/systemd/system/qemu-vm@{{ item.name }}.service.d/novnc-dependency.conf"
    mode: "0644"
    owner: root
    group: root
  become: true
  loop: "{{ _vms_novnc_vms }}"
  loop_control:
    label: "{{ item.name }}"

# The unit reads this file as an EnvironmentFile. It holds the port that the
# proxy listens on and the VNC display that it connects to.
- name: Deploy noVNC environment file for {{ item.name }}
  ansible.builtin.template:
    src: novnc-env.conf.j2
    dest: "{{ vms_vm_config_dir }}/novnc-{{ item.name }}.conf"
    owner: root
    group: root
    mode: "0644"
  become: true
  loop: "{{ _vms_novnc_vms }}"
  loop_control:
    label: "{{ item.name }}"

- name: Enable and start noVNC service for {{ item.name }}
  ansible.builtin.systemd_service:
    name: "novnc@{{ item.name }}.service"
    state: started
    enabled: true
    daemon_reload: true
  become: true
  loop: "{{ _vms_novnc_vms }}"
  loop_control:
    label: "{{ item.name }}"
