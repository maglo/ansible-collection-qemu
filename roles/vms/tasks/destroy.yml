---
# Destroy one VM and every artifact that belongs to it. `item` is the resolved
# VM entry, set by service.yml. validate.yml has already checked that the VM
# carries `force_destroy: true`.
#
# Order matters. The VM goes down through the guest first: the drop-in units
# make it require its swtpm and noVNC instances, so stopping either of those
# first would take the VM down with SIGTERM and no guest shutdown.

- name: Gracefully shut down {{ item.name }}
  ansible.builtin.include_tasks: shutdown.yml

- name: Disable VM service for {{ item.name }}
  ansible.builtin.systemd_service:
    name: "qemu-vm@{{ item.name }}.service"
    enabled: false
  become: true
  failed_when: false

- name: Stop and disable noVNC service for {{ item.name }}
  ansible.builtin.systemd_service:
    name: "novnc@{{ item.name }}.service"
    state: stopped
    enabled: false
  become: true
  failed_when: false

- name: Stop and disable swtpm service for {{ item.name }}
  ansible.builtin.systemd_service:
    name: "swtpm@{{ item.name }}.service"
    state: stopped
    enabled: false
  become: true
  failed_when: false

# Every path is removed without a condition. Removing a path that is not there
# is a no-op, and a conditional removal would leak state: an operator who drops
# `tpm: true` in the same change that sets `state: absent` would otherwise
# leave the TPM state of the VM behind, and the next VM of that name would
# adopt it.
#
# `<name>_VARS.fd.secboot` is the marker file of collection versions before
# 0.4.0. It is removed here for the same reason.
- name: Remove the artifacts of {{ item.name }}
  ansible.builtin.file:
    path: "{{ _vms_destroy_path }}"
    state: absent
  become: true
  loop:
    - "{{ vms_vm_config_dir }}/{{ item.name }}.conf"
    - "{{ vms_vm_config_dir }}/novnc-{{ item.name }}.conf"
    - "{{ vms_image_dir }}/{{ item.name }}.{{ item.disk_format }}"
    - "{{ vms_image_dir }}/{{ item.name }}-seed.iso"
    - "{{ vms_image_dir }}/.cloud-init-staging/{{ item.name }}"
    - "{{ vms_image_dir }}/{{ item.name }}_VARS.fd"
    - "{{ vms_image_dir }}/{{ item.name }}_VARS.fd.state"
    - "{{ vms_image_dir }}/{{ item.name }}_VARS.fd.secboot"
    - "/var/lib/qemu/{{ item.name }}"
    - "{{ vms_swtpm_state_dir }}/{{ item.name }}"
    - "{{ vms_swtpm_state_dir }}/{{ item.name }}.state"
    - "/etc/systemd/system/qemu-vm@{{ item.name }}.service.d"
  loop_control:
    loop_var: _vms_destroy_path
    label: "{{ _vms_destroy_path }}"

# The one removal that carries a condition, because the path is not known
# without it: `vms_labview_inventory_dir` defaults to null, and joining a name
# onto that would ask for `/<name>.yml` to be removed from the root directory.
# A teardown run therefore has to set the same directory the creating run set,
# or the entry is left behind.
- name: Remove the console service inventory entry of {{ item.name }}
  ansible.builtin.file:
    path: "{{ vms_labview_inventory_dir }}/{{ item.name }}.yml"
    state: absent
  become: true
  when: vms_labview_inventory_dir | default('', true) | length > 0

- name: Reload systemd daemon after destroying {{ item.name }}
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true
