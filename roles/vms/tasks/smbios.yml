---
# Write the SMBIOS type 11 OEM strings of each VM to one file per string.
#
# QEMU reads each string with `-smbios type=11,path=FILE`. The role does not
# use the `value=` form, because the systemd unit passes the arguments as an
# unquoted `$QEMU_ARGS`. systemd splits that variable at each space and does
# not interpret quotation marks inside the value, so a string that contains a
# space would become two arguments. A file holds the space instead.

# The per-VM tasks also remove the files of an earlier, longer list, so they
# have to run for a VM whose key was deleted. Stat the directory to find those
# VMs. A host where no VM ever used the key gets no per-VM tasks at all.
- name: Stat the SMBIOS directory of {{ item.name }}
  ansible.builtin.stat:
    path: /var/lib/qemu/{{ item.name }}/smbios
  register: _vms_smbios_dirs
  become: true
  loop: "{{ _vms_active_vms }}"
  loop_control:
    label: "{{ item.name }}"

- name: Collect the VMs that need SMBIOS files written or removed
  ansible.builtin.set_fact:
    _vms_smbios_managed: >-
      {{ _vms_smbios_vms
         + (_vms_smbios_dirs.results | selectattr('stat.exists')
            | map(attribute='item') | list) }}

# An OEM string can hold a secret, for example
# `io.systemd.credential:mypassword=...`. Only the QEMU user may read it.
- name: Create the SMBIOS directory for {{ item.name }}
  ansible.builtin.file:
    path: /var/lib/qemu/{{ item.name }}/smbios
    state: directory
    owner: "{{ vms_service_user }}"
    group: "{{ vms_service_group }}"
    mode: "0700"
  become: true
  loop: "{{ _vms_smbios_vms }}"
  loop_control:
    label: "{{ item.name }}"

- name: Write the SMBIOS OEM strings of {{ _vms_smbios_vm.name }}
  ansible.builtin.include_tasks: smbios_strings.yml
  loop: "{{ _vms_smbios_managed | unique(attribute='name') | list }}"
  loop_control:
    label: "{{ _vms_smbios_vm.name }}"
    loop_var: _vms_smbios_vm
