---
# Each VM gets a runtime directory. QEMU opens its monitor socket there, and
# the SMBIOS OEM string files live in a subdirectory of it. The graceful
# shutdown path writes `system_powerdown` to the monitor socket.
- name: Create runtime directory for {{ item.name }}
  ansible.builtin.file:
    path: /var/lib/qemu/{{ item.name }}
    state: directory
    owner: "{{ vms_service_user }}"
    group: "{{ vms_service_group }}"
    mode: "0755"
  become: true
  loop: "{{ _vms_active_vms }}"
  loop_control:
    label: "{{ item.name }}"
