---
# Give every UEFI VM its own writable copy of an OVMF variable store.
#
# `vars/main.yml` already resolved which template each VM uses: the per-VM
# `nvram_template` key when it is set, otherwise the global variable that
# matches the resolved `secure_boot` flag.

# ── Read the current state of each VM ──────────────────────
- name: Stat the NVRAM template of {{ item.name }}
  ansible.builtin.stat:
    path: "{{ item.nvram_template }}"
    checksum_algorithm: sha256
  register: _vms_nvram_templates
  become: true
  loop: "{{ _vms_uefi_vms }}"
  loop_control:
    label: "{{ item.name }}"

- name: Validate that every NVRAM template exists
  ansible.builtin.assert:
    that:
      - _vms_missing_templates | length == 0
    fail_msg: >-
      These NVRAM templates do not exist: {{ _vms_missing_templates | join(', ') }}.
      Install the firmware package (edk2-ovmf), or correct vms_ovmf_vars_template,
      vms_ovmf_vars_secboot_template or the per-VM nvram_template key.
  vars:
    _vms_missing_templates: >-
      {{ _vms_nvram_templates.results | rejectattr('stat.exists')
         | map(attribute='item.nvram_template') | unique | list }}

- name: Stat the NVRAM file of {{ item.name }}
  ansible.builtin.stat:
    path: "{{ vms_image_dir }}/{{ item.name }}_VARS.fd"
  register: _vms_nvram_files
  become: true
  loop: "{{ _vms_uefi_vms }}"
  loop_control:
    label: "{{ item.name }}"

- name: Stat the NVRAM state file of {{ item.name }}
  ansible.builtin.stat:
    path: "{{ vms_image_dir }}/{{ item.name }}_VARS.fd.state"
  register: _vms_nvram_states
  become: true
  loop: "{{ _vms_uefi_vms }}"
  loop_control:
    label: "{{ item.name }}"

# The marker file of collection versions before 0.4.0. It records only the
# secure_boot flag, by its presence.
- name: Stat the legacy secure boot marker of {{ item.name }}
  ansible.builtin.stat:
    path: "{{ vms_image_dir }}/{{ item.name }}_VARS.fd.secboot"
  register: _vms_nvram_legacy
  become: true
  loop: "{{ _vms_uefi_vms }}"
  loop_control:
    label: "{{ item.name }}"

- name: Read the NVRAM state file of {{ item.item.name }}
  ansible.builtin.slurp:
    src: "{{ vms_image_dir }}/{{ item.item.name }}_VARS.fd.state"
  register: _vms_nvram_state_contents
  become: true
  when: item.stat.exists
  loop: "{{ _vms_nvram_states.results }}"
  loop_control:
    label: "{{ item.item.name }}"

# ── Decide which VMs need a new NVRAM file ─────────────────
# The decision compares one fingerprint string, not a set of values of
# different types. A rewrite happens when one of these is true:
#   * vms_nvram_force_reset is true (a one-shot reset from the command line);
#   * the NVRAM file is absent (a new VM);
#   * the state file holds a different fingerprint, so the secure_boot flag,
#     the template path, the content of the template, or the generation
#     changed;
#   * there is no state file and the legacy marker disagrees with secure_boot.
#
# A VM that has only a legacy marker that agrees with secure_boot keeps its
# NVRAM file: the role writes a state file for it and removes the marker. An
# upgrade from an earlier version therefore keeps the UEFI boot entries of
# every VM that already exists.
- name: Build the NVRAM plan
  ansible.builtin.set_fact:
    _vms_nvram_plan: "{{ _vms_nvram_plan_json | from_json }}"
  vars:
    _vms_nvram_plan_json: >-
      {%- set _out = [] -%}
      {%- for _vm in _vms_uefi_vms -%}
      {%-   set _i = loop.index0 -%}
      {%-   set _slurped = _vms_nvram_state_contents.results[_i] -%}
      {%-   set _old = (_slurped.content | b64decode | from_json)
                       if (_slurped.content is defined) else {} -%}
      {%-   set _checksum = _vms_nvram_templates.results[_i].stat.checksum -%}
      {%-   set _exists = _vms_nvram_files.results[_i].stat.exists -%}
      {%-   set _legacy = _vms_nvram_legacy.results[_i].stat.exists -%}
      {%-   set _fingerprint = (_vm.secure_boot | string) ~ '|' ~ _vm.nvram_template
                               ~ '|' ~ _checksum ~ '|' ~ (_vm.nvram_generation | string) -%}
      {%-   set _ = _out.append({
              'name': _vm.name,
              'template': _vm.nvram_template,
              'exists': _exists,
              'rewrite': (vms_nvram_force_reset | bool)
                         or (not _exists)
                         or (_old | length > 0 and _old.fingerprint | default('') != _fingerprint)
                         or (_old | length == 0 and _vm.secure_boot != _legacy),
              'state': {
                'fingerprint': _fingerprint,
                'secure_boot': _vm.secure_boot,
                'template': _vm.nvram_template,
                'template_checksum': _checksum,
                'generation': _vm.nvram_generation,
              },
            }) -%}
      {%- endfor -%}
      {{ _out | to_json }}

- name: Collect the VMs that need a new NVRAM file
  ansible.builtin.set_fact:
    _vms_nvram_resets: >-
      {{ _vms_nvram_plan | selectattr('rewrite') | selectattr('exists') | list }}

# ── Replace the NVRAM file ─────────────────────────────────
# QEMU maps the NVRAM file as pflash while the VM runs, so a rewrite under a
# running VM is lost or corrupts the store. Stop the VM first, write the file,
# then start the VM again if it was running. A VM that has no NVRAM file yet
# cannot be running, so it is not in _vms_nvram_resets.
- name: Get the service state before the NVRAM reset of {{ item.name }}
  ansible.builtin.systemd_service:
    name: "qemu-vm@{{ item.name }}.service"
  register: _vms_nvram_pre_states
  become: true
  failed_when: false
  changed_when: false
  loop: "{{ _vms_nvram_resets }}"
  loop_control:
    label: "{{ item.name }}"

- name: Stop the VM before the NVRAM reset of {{ item.name }}
  ansible.builtin.systemd_service:
    name: "qemu-vm@{{ item.name }}.service"
    state: stopped
  become: true
  failed_when: false
  loop: "{{ _vms_nvram_resets }}"
  loop_control:
    label: "{{ item.name }}"

- name: Copy the OVMF variable store of {{ item.name }}
  ansible.builtin.copy:
    src: "{{ item.template }}"
    dest: "{{ vms_image_dir }}/{{ item.name }}_VARS.fd"
    remote_src: true
    force: "{{ item.rewrite }}"
    owner: "{{ vms_service_user }}"
    group: "{{ vms_service_group }}"
    mode: "0644"
  become: true
  loop: "{{ _vms_nvram_plan }}"
  loop_control:
    label: "{{ item.name }}"

- name: Write the NVRAM state file of {{ item.name }}
  ansible.builtin.copy:
    content: "{{ item.state | to_nice_json }}\n"
    dest: "{{ vms_image_dir }}/{{ item.name }}_VARS.fd.state"
    owner: "{{ vms_service_user }}"
    group: "{{ vms_service_group }}"
    mode: "0644"
  become: true
  loop: "{{ _vms_nvram_plan }}"
  loop_control:
    label: "{{ item.name }}"

# The state file replaces the marker file of earlier collection versions.
- name: Remove the legacy secure boot marker of {{ item.name }}
  ansible.builtin.file:
    path: "{{ vms_image_dir }}/{{ item.name }}_VARS.fd.secboot"
    state: absent
  become: true
  loop: "{{ _vms_nvram_plan }}"
  loop_control:
    label: "{{ item.name }}"

- name: Start the VM again after the NVRAM reset of {{ item.item.name }}
  ansible.builtin.systemd_service:
    name: "qemu-vm@{{ item.item.name }}.service"
    state: started
  become: true
  when: (item.status.ActiveState | default('inactive')) == 'active'
  loop: "{{ _vms_nvram_pre_states.results }}"
  loop_control:
    label: "{{ item.item.name }}"
