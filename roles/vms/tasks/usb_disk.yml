---
# QEMU takes the image format from the file name extension (see vm.conf.j2),
# so an unknown extension would attach the image with the wrong format.
- name: Validate USB disk image configuration
  ansible.builtin.assert:
    that:
      - item.usb_disk_image | length > 0
      - (item.usb_disk_image | lower | regex_search('\\.(iso|raw|img|qcow2)$')) is not none
    fail_msg: >-
      VM {{ item.name }}: usb_disk_image must end with .iso, .raw, .img, or .qcow2
  loop: "{{ _vms_usb_vms }}"
  loop_control:
    label: "{{ item.name }}"

# The role never creates a USB image: it is pre-provisioned, usually an
# installer ISO. A missing file gives a VM that starts and then fails to boot,
# so check it here instead.
- name: Check USB disk image exists
  ansible.builtin.stat:
    path: "{{ item.usb_disk_image }}"
  register: _vms_usb_image_stats
  loop: "{{ _vms_usb_vms }}"
  loop_control:
    label: "{{ item.name }} -> {{ item.usb_disk_image }}"

- name: Assert USB disk image file exists
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
    fail_msg: "VM {{ item.item.name }}: usb_disk_image '{{ item.item.usb_disk_image }}' does not exist"
  loop: "{{ _vms_usb_image_stats.results }}"
  loop_control:
    label: "{{ item.item.name }}"
