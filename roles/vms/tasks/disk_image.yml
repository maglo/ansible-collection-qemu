---
# Download the backing image of every VM that sets disk_image_url, once per
# URL, into a cache directory that all VMs share.

- name: Create disk image cache directory
  ansible.builtin.file:
    path: "{{ vms_image_cache_dir }}"
    state: directory
    owner: "{{ vms_service_user }}"
    group: "{{ vms_service_group }}"
    mode: "0755"
  become: true

# `force: false` keeps a cached image. A VM that wants a newer build of the
# same URL needs a new file name, or the cached file has to be removed.
#
# The checksum comes from the per-VM disk_image_checksum key. Setting
# vms_verify_checksums to false skips the comparison, which is for a mirror
# that publishes no checksum. Leave it on.
- name: Download disk images to cache
  ansible.builtin.get_url:
    url: "{{ item.disk_image_url }}"
    dest: "{{ vms_image_cache_dir }}/{{ item.disk_image_url | basename }}"
    checksum: "{{ item.disk_image_checksum | default(omit) if (vms_verify_checksums | bool) else omit }}"
    owner: "{{ vms_service_user }}"
    group: "{{ vms_service_group }}"
    mode: "0644"
    force: false
  become: true
  loop: "{{ _vms_image_vms }}"
  loop_control:
    label: "{{ item.name }} - {{ item.disk_image_url | basename }}"

# An overlay can only sit on a qcow2 backing file, and a truncated download
# gives a file that qemu-img cannot read at all. Check both here, so the
# failure names the image instead of appearing later as a VM that will not boot.
- name: Validate cached images are valid qcow2 format
  ansible.builtin.command:
    cmd: "qemu-img info {{ vms_image_cache_dir }}/{{ item.disk_image_url | basename }}"
  register: _vms_image_info
  changed_when: false
  failed_when: "'file format: qcow2' not in _vms_image_info.stdout"
  loop: "{{ _vms_image_vms }}"
  loop_control:
    label: "{{ item.name }} - {{ item.disk_image_url | basename }}"
