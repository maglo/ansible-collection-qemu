---
# The role resolves the effective settings of every VM once, in vars/main.yml.
# Each task file below reads a ready-made selection from there
# (_vms_uefi_vms, _vms_tpm_vms, _vms_novnc_vms, ...) instead of filtering
# vms_list again, and reads `item.tpm` instead of
# `item.tpm | default(vms_default_tpm)`.
#
# Each import is gated on the selection it works on, so a play that manages
# plain VMs never evaluates the firmware, TPM or noVNC tasks.
#
# The three files that work on the whole of `_vms_active_vms` — disk.yml,
# monitor.yml and smbios.yml — carry no such gate, on purpose. `import_tasks`
# is static, so a `when` on the import is copied onto every task of the file
# rather than skipping the file, and Ansible builds a task's loop before it
# evaluates that task's `when`. A loop that reads a variable the same file
# defines is therefore still templated on a run the gate meant to skip, and
# raises on it: a destroy-only run, where `_vms_active_vms` is empty, died on
# the undefined `_vms_smbios_managed` (#169). Every task in those three files
# loops over a selection that is empty on such a run, so each one no-ops by
# itself and needs no condition.

# ── Validation ─────────────────────────────────────────────
- name: Validate the VM list
  ansible.builtin.import_tasks: validate.yml

# ── Creation phase (every VM whose state is not `absent`) ──
- name: Ensure UEFI firmware is available
  ansible.builtin.import_tasks: firmware.yml
  when: _vms_uefi_vms | length > 0

- name: Verify the Secure Boot variable stores
  ansible.builtin.import_tasks: firmware_verify.yml
  when:
    - _vms_secure_boot_vms | length > 0
    - vms_nvram_verify | bool

- name: Download and cache disk images
  ansible.builtin.import_tasks: disk_image.yml
  when: _vms_image_vms | length > 0

- name: Create VM disk images
  ansible.builtin.import_tasks: disk.yml

- name: Configure per-VM TPM emulation
  ansible.builtin.import_tasks: tpm.yml
  when: _vms_tpm_vms | length > 0

- name: Configure VM networking
  ansible.builtin.import_tasks: network.yml
  when: _vms_bridge_vms | length > 0

- name: Configure noVNC for VMs
  ansible.builtin.import_tasks: novnc.yml
  when: _vms_novnc_vms | length > 0

- name: Setup QEMU monitor sockets
  ansible.builtin.import_tasks: monitor.yml

- name: Write per-VM SMBIOS OEM strings
  ansible.builtin.import_tasks: smbios.yml

- name: Validate USB disk image attachments
  ansible.builtin.import_tasks: usb_disk.yml
  when: _vms_usb_vms | length > 0

- name: Generate cloud-init seed ISOs
  ansible.builtin.import_tasks: cloud_init.yml
  when: _vms_cloud_init_vms | length > 0

# ── Service phase, then the `restarted` and `absent` states ──
- name: Generate VM config and manage service
  ansible.builtin.import_tasks: service.yml
