---
# Shut one VM down. `item` is the resolved VM entry, set by the caller
# (restart.yml or destroy.yml).
#
# QEMU exits on SIGTERM without telling the guest, which leaves the guest file
# systems dirty. So ask the guest first, over the QEMU monitor socket, and give
# it `shutdown_timeout` seconds. Then stop the unit either way: the guest may
# ignore the request, and `Restart=on-failure` would otherwise bring a VM that
# exited non-zero straight back up.

- name: Check VM service status for {{ item.name }}
  ansible.builtin.systemd_service:
    name: "qemu-vm@{{ item.name }}.service"
  become: true
  register: _vms_shutdown_status
  changed_when: false

- name: Send ACPI shutdown to {{ item.name }}
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      echo "system_powerdown" | socat - UNIX-CONNECT:/var/lib/qemu/{{ item.name }}/monitor.sock
    executable: /bin/bash
  become: true
  when:
    - _vms_shutdown_status.status.ActiveState == 'active'
    - _vms_shutdown_status.status.SubState == 'running'
  failed_when: false
  changed_when: true
  register: _vms_shutdown_acpi

# QEMU removes the monitor socket when it exits. Waiting for the socket to
# disappear therefore waits for the guest to finish powering down. A timeout
# is not an error here: the next task stops the unit regardless.
- name: Wait for graceful shutdown of {{ item.name }}
  ansible.builtin.wait_for:
    path: /var/lib/qemu/{{ item.name }}/monitor.sock
    state: absent
    timeout: "{{ item.shutdown_timeout }}"
  when: (_vms_shutdown_acpi.rc | default(1)) == 0
  failed_when: false

- name: Stop the VM service of {{ item.name }}
  ansible.builtin.systemd_service:
    name: "qemu-vm@{{ item.name }}.service"
    state: stopped
  become: true

- name: Verify VM service is stopped for {{ item.name }}
  ansible.builtin.systemd_service:
    name: "qemu-vm@{{ item.name }}.service"
  become: true
  register: _vms_shutdown_final
  changed_when: false
  failed_when: _vms_shutdown_final.status.ActiveState not in ['inactive', 'failed']
