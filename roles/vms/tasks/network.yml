---
# The QEMU bridge helper reads this ACL and refuses a bridge that is not
# listed. The file holds every bridge that a VM in vms_list uses.
- name: Write bridge.conf
  ansible.builtin.template:
    src: bridge.conf.j2
    dest: "{{ vms_bridge_conf }}"
    owner: root
    group: root
    mode: "0644"
  become: true
