---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ansible-core ansible-lint

      - name: Run ansible-lint
        run: ansible-lint

  sanity:
    name: Sanity
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ansible-version:
          - stable-2.16
          - stable-2.17
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: ansible_collections/maglo/qemu

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Ansible (${{ matrix.ansible-version }})
        run: pip install https://github.com/ansible/ansible/archive/${{ matrix.ansible-version }}.tar.gz

      - name: Run sanity tests
        run: ansible-test sanity --color yes -v
        working-directory: ansible_collections/maglo/qemu

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: ansible_collections/maglo/qemu

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ansible-core antsibull-docs

      - name: Verify role READMEs exist
        run: |
          for role in ansible_collections/maglo/qemu/roles/*/; do
            role_name=$(basename "$role")
            if [ ! -f "$role/README.md" ]; then
              echo "ERROR: Missing README.md for role $role_name"
              exit 1
            fi
          done
          echo "All roles have README.md"

      - name: Verify argument_specs with ansible-doc
        run: |
          for role in ansible_collections/maglo/qemu/roles/*/; do
            role_name=$(basename "$role")
            echo "Checking maglo.qemu.$role_name..."
            ansible-doc -t role "maglo.qemu.$role_name"
          done
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}

      - name: Lint collection docs
        run: antsibull-docs lint-collection-docs --plugin-docs ansible_collections/maglo/qemu

      # The site is what GitHub Pages publishes from main. Build it here so a
      # PR that breaks a guide, a cross-reference or the role reference fails
      # before it is merged; sphinx-build runs with -W, so a warning is an
      # error.
      - name: Install the documentation site dependencies
        run: pip install -r ansible_collections/maglo/qemu/docs/site/requirements.txt

      - name: Build the documentation site
        run: ansible_collections/maglo/qemu/docs/site/build.sh

  molecule:
    name: Molecule - ${{ matrix.target.role }} (${{ matrix.target.scenario }}) - EL${{ matrix.el_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Two real axes, so this is a 6 x 2 cross product: twelve jobs.
      #
      # Do not move the scenarios back into `include:`. An `include:` entry is
      # merged into every existing combination of the other axes, and a later
      # entry overwrites the keys an earlier one set. Six entries that all set
      # `role` and `scenario` therefore collapse to one job per el_version,
      # running whichever scenario is listed last.
      #
      # `disk_image` is left out on purpose: it downloads a multi-gigabyte
      # cloud image on every run. Run it by hand with
      # `cd roles/vms && molecule test -s disk_image`.
      matrix:
        el_version: [9, 10]
        target:
          - {role: host, scenario: default}
          - {role: host, scenario: novnc}
          - {role: vms, scenario: default}
          - {role: vms, scenario: secureboot}
          - {role: vms, scenario: lifecycle}
          - {role: vms, scenario: novnc}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install molecule molecule-plugins[docker] ansible-core

      # Molecule fetches the docker driver's collections from Galaxy in its
      # `dependency` step, once per job. Twelve jobs start within the same
      # second, and Galaxy answers some of those requests with a reset
      # connection. That fails the job before a single test task runs. Fetch
      # them here instead, and retry: molecule looks in ~/.ansible/collections
      # before it asks Galaxy, so its own fetch then finds nothing to do.
      #
      # Both collections must be listed. The driver asks for both, so covering
      # only one leaves the other exposed to the same reset. Keep the names and
      # versions in step with `required_collections` in the driver:
      # molecule_plugins/docker/driver.py.
      - name: Install the collections the docker driver needs
        run: |
          for collection in 'community.docker:>=3.10.2' 'ansible.posix:>=1.4.0'; do
            for delay in 5 15 30 60; do
              ansible-galaxy collection install "$collection" && continue 2
              echo "Galaxy did not answer for ${collection}; retrying in ${delay}s"
              sleep "$delay"
            done
            ansible-galaxy collection install "$collection"
          done

      - name: Run Molecule
        run: molecule test -s ${{ matrix.target.scenario }}
        working-directory: roles/${{ matrix.target.role }}
        env:
          EL_VERSION: ${{ matrix.el_version }}

  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install antsibull-changelog
        run: pip install antsibull-changelog

      - name: Lint changelog fragments
        run: antsibull-changelog lint

  gate:
    name: CI
    if: always()
    needs: [lint, sanity, docs, molecule, changelog]
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        run: |-
          results='${{ toJSON(needs.*.result) }}'
          if echo "$results" | grep -qE '"(failure|cancelled)"'; then
            echo "One or more required jobs did not succeed."
            exit 1
          fi
