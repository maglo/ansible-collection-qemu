---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run every job, whatever changed. Use this before cutting a release, or to
  # re-run a suite that the path filters below decided to skip.
  workflow_dispatch:

jobs:
  # Work out which of the jobs below the change can actually affect, so a
  # release commit (CHANGELOG.rst, changelogs/changelog.yaml, galaxy.yml) or a
  # docs-only change no longer pays for twelve molecule jobs.
  #
  # The filtering happens *inside* the workflow, not with `on.<event>.paths`.
  # A workflow that an event filters out never reports its checks, and the
  # `CI` gate below is a required status check on `main` — a PR would wait for
  # a check that is never coming. The gate always runs; a job the filter turns
  # off ends up `skipped`, which the gate accepts.
  #
  # Filters err towards running. Each one lists what feeds the job, plus this
  # workflow itself, so a change to CI is always tested by the full suite.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      lint: ${{ steps.filter.outputs.lint }}
      sanity: ${{ steps.filter.outputs.sanity }}
      docs: ${{ steps.filter.outputs.docs }}
      molecule: ${{ steps.filter.outputs.molecule }}
      changelog: ${{ steps.filter.outputs.changelog }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Both ends of the comparison have to be in the local history.
          fetch-depth: 0

      - name: Work out which jobs the change needs
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          # On a pull request, compare the head against the base branch. On a
          # push to main, compare against the tip the push moved away from.
          BASE: >-
            ${{ github.event_name == 'pull_request'
                && github.event.pull_request.base.sha
                || github.event.before }}
          HEAD: >-
            ${{ github.event_name == 'pull_request'
                && github.event.pull_request.head.sha
                || github.sha }}
        run: |
          set -euo pipefail

          emit() {
            echo "$1=$2" >> "$GITHUB_OUTPUT"
            printf '  %-10s %s\n' "$1:" "$2"
          }

          run_everything() {
            echo "$1 - running every job."
            for job in lint sanity docs molecule changelog; do
              emit "$job" true
            done
            exit 0
          }

          if [ "$EVENT" = workflow_dispatch ]; then
            run_everything "Started by hand"
          fi

          # A new branch pushes with an all-zero `before`, and a force push
          # can leave a `before` that is no longer reachable. Neither can be
          # compared against, so take no chances and run the lot.
          if [ -z "$BASE" ] ||
             ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            run_everything "No base commit to compare against"
          fi

          # `A...B` is the diff from the point the two branches parted, so a
          # pull request is read as one change however many commits it holds,
          # and a commit that landed on main after the branch forked is not
          # counted against it. Two unrelated histories have no such point and
          # git refuses the range; fall back to running everything rather than
          # failing the gate with it.
          if ! changed="$(git diff --name-only "$BASE...$HEAD")"; then
            run_everything "Cannot diff ${BASE}...${HEAD}"
          fi

          echo "Changed files:"
          printf '%s\n' "$changed" | sed 's/^/  /'
          echo

          decide() {  # decide <output> <extended regex>
            if printf '%s\n' "$changed" | grep -qE "$2"; then
              emit "$1" true
            else
              emit "$1" false
            fi
          }

          # What the collection actually does on a host. Every job depends
          # on it, and so does this workflow, which describes them all.
          content='^(roles|playbooks|meta|plugins)/'
          workflow='^\.github/workflows/ci\.yml$'
          always="${content}|${workflow}"

          lint_paths='^\.ansible-lint$|^galaxy\.yml$'
          sanity_paths='^galaxy\.yml$|^README\.md$|^docs/docsite/'
          # The `docs` job builds the same site that .github/workflows/docs.yml
          # publishes, so it is what validates a change to that workflow too.
          docs_paths='^docs/|^README\.md$|^galaxy\.yml$'
          docs_paths="${docs_paths}"'|^\.github/workflows/docs\.yml$'

          echo "Jobs to run:"
          decide lint      "${always}|${lint_paths}"
          decide sanity    "${always}|${sanity_paths}"
          decide docs      "${always}|${docs_paths}"
          decide changelog "${workflow}|^changelogs/"
          # Molecule converges the roles in a container, so only the content it
          # runs matters. Role READMEs live under roles/, so a docs-only edit
          # there still books twelve jobs; that is the safe side to be on.
          decide molecule  "${always}"

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ansible-core ansible-lint

      - name: Run ansible-lint
        run: ansible-lint

  sanity:
    name: Sanity
    needs: changes
    if: needs.changes.outputs.sanity == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ansible-version:
          - stable-2.16
          - stable-2.17
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: ansible_collections/maglo/qemu

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Ansible (${{ matrix.ansible-version }})
        run: pip install https://github.com/ansible/ansible/archive/${{ matrix.ansible-version }}.tar.gz

      - name: Run sanity tests
        run: ansible-test sanity --color yes -v
        working-directory: ansible_collections/maglo/qemu

  docs:
    name: Docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: ansible_collections/maglo/qemu

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ansible-core antsibull-docs

      - name: Verify role READMEs exist
        run: |
          for role in ansible_collections/maglo/qemu/roles/*/; do
            role_name=$(basename "$role")
            if [ ! -f "$role/README.md" ]; then
              echo "ERROR: Missing README.md for role $role_name"
              exit 1
            fi
          done
          echo "All roles have README.md"

      - name: Verify argument_specs with ansible-doc
        run: |
          for role in ansible_collections/maglo/qemu/roles/*/; do
            role_name=$(basename "$role")
            echo "Checking maglo.qemu.$role_name..."
            ansible-doc -t role "maglo.qemu.$role_name"
          done
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}

      - name: Lint collection docs
        run: antsibull-docs lint-collection-docs --plugin-docs ansible_collections/maglo/qemu

      # The site is what GitHub Pages publishes from main. Build it here so a
      # PR that breaks a guide, a cross-reference or the role reference fails
      # before it is merged; sphinx-build runs with -W, so a warning is an
      # error.
      - name: Install the documentation site dependencies
        run: pip install -r ansible_collections/maglo/qemu/docs/site/requirements.txt

      - name: Build the documentation site
        run: ansible_collections/maglo/qemu/docs/site/build.sh

  molecule:
    name: Molecule - ${{ matrix.target.role }} (${{ matrix.target.scenario }}) - EL${{ matrix.el_version }}
    needs: changes
    if: needs.changes.outputs.molecule == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Two real axes, so this is an 8 x 1 cross product: eight jobs. The
      # `el_version` axis is kept at one value so that the next EL release is
      # added by extending the list.
      #
      # Do not move the scenarios back into `include:`. An `include:` entry is
      # merged into every existing combination of the other axes, and a later
      # entry overwrites the keys an earlier one set. Eight entries that all set
      # `role` and `scenario` therefore collapse to one job per el_version,
      # running whichever scenario is listed last.
      #
      # `disk_image` is left out on purpose: it downloads a multi-gigabyte
      # cloud image on every run. Run it by hand with
      # `cd roles/vms && molecule test -s disk_image`.
      matrix:
        el_version: [10]
        target:
          - {role: host, scenario: default}
          - {role: host, scenario: novnc}
          - {role: vms, scenario: default}
          - {role: vms, scenario: secureboot}
          - {role: vms, scenario: lifecycle}
          - {role: vms, scenario: novnc}
          - {role: vms, scenario: labview}
          - {role: labview, scenario: default}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install molecule molecule-plugins[docker] ansible-core

      # Molecule fetches the docker driver's collections from Galaxy in its
      # `dependency` step, once per job. Twelve jobs start within the same
      # second, and Galaxy answers some of those requests with a reset
      # connection. That fails the job before a single test task runs. Fetch
      # them here instead, and retry: molecule looks in ~/.ansible/collections
      # before it asks Galaxy, so its own fetch then finds nothing to do.
      #
      # Both collections must be listed. The driver asks for both, so covering
      # only one leaves the other exposed to the same reset. Keep the names and
      # versions in step with `required_collections` in the driver:
      # molecule_plugins/docker/driver.py.
      - name: Install the collections the docker driver needs
        run: |
          for collection in 'community.docker:>=3.10.2' 'ansible.posix:>=1.4.0'; do
            for delay in 5 15 30 60; do
              ansible-galaxy collection install "$collection" && continue 2
              echo "Galaxy did not answer for ${collection}; retrying in ${delay}s"
              sleep "$delay"
            done
            ansible-galaxy collection install "$collection"
          done

      - name: Run Molecule
        run: molecule test -s ${{ matrix.target.scenario }}
        working-directory: roles/${{ matrix.target.role }}
        env:
          EL_VERSION: ${{ matrix.el_version }}

  changelog:
    name: Changelog
    needs: changes
    if: needs.changes.outputs.changelog == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install antsibull-changelog
        run: pip install antsibull-changelog

      - name: Lint changelog fragments
        run: antsibull-changelog lint

  # The required status check on `main`. It runs on every event, so it always
  # reports, and it only objects to a job that ran and did not pass: a job the
  # path filters turned off reports `skipped`, which is not a failure.
  gate:
    name: CI
    if: always()
    needs: [changes, lint, sanity, docs, molecule, changelog]
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        run: |-
          results='${{ toJSON(needs.*.result) }}'
          if echo "$results" | grep -qE '"(failure|cancelled)"'; then
            echo "One or more required jobs did not succeed."
            exit 1
          fi
