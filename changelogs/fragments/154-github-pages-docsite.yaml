    feature, and the example playbooks. The README keeps a short overview of
    the collection and points at the site, so the page that Ansible Galaxy and
    the GitHub repository show is no longer the full reference (closes #154)."
  - "galaxy.yml - The ``documentation`` and ``homepage`` URLs now point at the
    documentation site instead of the README."
