---
major_changes:
  - >-
    host - noVNC configuration refactored (issue #50). Per-VM noVNC
    configuration moved from ``host`` role to ``vms`` role for better
    separation of concerns. Removed variables: ``host_novnc_vms``,
    ``host_novnc_install_dir``, ``host_novnc_version``.
    ``host_novnc_enabled`` now only installs the ``novnc`` package from EPEL.
    noVNC is installed via RPM package instead of git clone. Migrate by enabling
    noVNC per-VM via ``novnc_enabled: true`` on individual VM definitions in the
    ``vms`` role.
minor_changes:
  - "vms - Add per-VM noVNC web console configuration (issue #50)."
  - "vms - Auto-assign noVNC port (defaults to ``6080 + VNC display number``) when not specified (issue #50)."
  - "host - Simplify noVNC handling to package installation only; per-VM config moved to ``vms`` (issue #50)."
