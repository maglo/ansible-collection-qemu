---
minor_changes:
  - "vms role - each VM gets a serial console socket. QEMU opens it at ``/var/lib/qemu/<name>/serial.sock``, and the new per-VM ``serial_socket`` key and the ``vms_default_serial_socket`` variable move it. A console client attaches there to read and to drive the guest serial console (https://github.com/maglo/ansible-collection-qemu/issues/161)."
  - "vms role - each VM gets a QMP socket beside the human monitor socket. QEMU opens it at ``/var/lib/qemu/<name>/qmp.sock``, and the new per-VM ``qmp_socket`` key and the ``vms_default_qmp_socket`` variable move it. QMP carries typed commands such as ``send-key`` and ``screendump``. The ``-monitor`` socket stays where it is, so a consumer that drives it keeps working (https://github.com/maglo/ansible-collection-qemu/issues/162)."
  - "vms role - add the per-VM ``vnc_address`` key and the ``vms_default_vnc_address`` variable. They set the address that the VNC console binds. ``127.0.0.1`` reaches the console through the host only. noVNC keeps working, because it connects to ``localhost`` (https://github.com/maglo/ansible-collection-qemu/issues/163)."
  - "vms role - add the ``vms_vnc_address_deprecation_warning`` variable. It controls the warning that the role prints for a VM that leaves ``vnc_address`` unset (https://github.com/maglo/ansible-collection-qemu/issues/163)."
  - "vms role - the run fails when two VMs would open one serial socket or one QMP socket. The check runs with the other whole-list checks, before the role writes anything to the host (https://github.com/maglo/ansible-collection-qemu/issues/161)."
  - "vms role - the ``-monitor`` argument uses ``server=on,wait=off`` instead of the short form ``server,nowait``. QEMU 10.1 logs ``short-form boolean option 'server' deprecated`` for every VM that starts with the short form (https://github.com/maglo/ansible-collection-qemu/issues/162)."
deprecated_features:
  - "vms role - the default of ``vms_default_vnc_address`` is deprecated. It is empty, so the VNC console of every VM binds every interface and the raw RFB port is reachable from anywhere that can route to the host. The next release changes the default to ``127.0.0.1``. Until then the behaviour does not change. The role prints a warning for each VM that leaves ``vnc_address`` unset; set ``vms_vnc_address_deprecation_warning`` to ``false`` to silence it (https://github.com/maglo/ansible-collection-qemu/issues/163)."
breaking_changes:
  - "vms role - the guest serial console leaves the systemd journal. A VM starts with ``-display none`` and an explicit ``-serial`` that points at the new serial socket, in place of ``-nographic``. ``journalctl -u qemu-vm@<name>`` therefore holds the stderr of QEMU and the start and stop lines of systemd, and no guest console output. Read the guest console at ``/var/lib/qemu/<name>/serial.sock`` instead, for example with ``socat - UNIX-CONNECT:/var/lib/qemu/<name>/serial.sock`` (https://github.com/maglo/ansible-collection-qemu/issues/161)."
bugfixes:
  - "vms role - a duplicate check now names the value at fault. Every such message was empty, because it built the list with ``L | difference(L | unique)`` and ``difference`` is a set operation that always returns an empty list. This covers the checks for a duplicate VM name, VNC display, MAC address and noVNC port (https://github.com/maglo/ansible-collection-qemu/issues/161)."
