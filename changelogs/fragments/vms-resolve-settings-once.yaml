---
minor_changes:
  - "vms role - resolve the effective settings of every VM once, before the
    first task runs. Each task file now reads a ready-made selection
    (the UEFI VMs, the TPM VMs, the noVNC VMs, and so on) instead of filtering
    ``vms_list`` again with an expression that had to treat \"key absent\" and
    \"key set to false\" separately. The role also skips the firmware, TPM,
    noVNC, cloud-init and USB task files entirely when no VM uses them."
  - "vms role - check the whole VM list before the role changes anything on the
    host. The new checks reject a duplicate VM name, a name that cannot be a
    systemd instance name, ``secure_boot`` without ``uefi``, a
    ``disk_image_url`` with a non-qcow2 ``disk_format``, and two VMs that would
    share a VNC display, a MAC address or a noVNC port. The role derives the
    display and the address from the VM name, so two names can collide; the run
    now fails with the names instead of leaving the second VM unable to start."
  - "vms role - ``vms_verify_checksums`` now controls whether the per-VM
    ``disk_image_checksum`` is compared against the downloaded image. The
    variable was documented as reserved and had no effect."
bugfixes:
  - "vms role - clear the swtpm state only when ``tpm_generation`` increases.
    The role compared the generation for inequality, so lowering the value, or
    tidying a spent ``tpm_generation: 2`` line out of a playbook so that it
    fell back to 1, silently wiped the sealed key slots, the persistent handles
    and the PCR history of a running guest."
  - "vms role - honour ``vms_default_novnc_enabled``. A VM that did not set the
    per-VM ``novnc_enabled`` key was never configured for noVNC, even with the
    role default set to ``true``, while ``state: restarted`` and
    ``state: absent`` did honour the default."
  - "vms role - honour ``vms_default_novnc_port``. The variable was declared and
    documented but never read; every VM got 6080 plus its VNC display."
  - "vms role - shut the guest down over the QEMU monitor before destroying a
    VM. ``state: absent`` stopped and disabled the service first, which left
    the graceful shutdown with nothing to do, so the guest got a SIGTERM and its
    file systems stayed dirty. ``state: restarted`` had the same problem for a
    noVNC VM, whose service the role stopped first."
  - "vms role - remove every artifact of a destroyed VM. The UEFI variable
    store, the TPM state directory and the TPM state file were removed only
    when the VM still carried ``uefi: true`` or ``tpm: true``, so an operator
    who dropped the key in the same change that set ``state: absent`` left the
    state behind for the next VM of that name to adopt."
  - "vms role - fall back to stopping the unit when the guest ignores the ACPI
    powerdown. The condition that triggered the fallback could never be true,
    because the task it tested had ``failed_when: false``."
trivial:
  - "host role - declare ``host_swtpm_state_dir`` in ``meta/argument_specs.yml``."
