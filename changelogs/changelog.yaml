    - podman-molecule.yaml
    - swtpm-refactor.yaml
    - url-disk-image.yaml
    release_date: '2026-02-20'
  0.1.1:
    changes:
      bugfixes:
      - docs - Add EPEL to the Prerequisites section of ``README.md`` and ``roles/host/README.md``;
        note that the collection intentionally does not manage EPEL to support airgapped
        deployments (`#80 <https://github.com/maglo/ansible-collection-qemu/issues/80>`_).
      - 'host role - Add ``become: true`` to all privileged tasks so the role can
        be used without ``become: true`` at playbook level (`#74 <https://github.com/maglo/ansible-collection-qemu/issues/74>`_).'
      - host role - Change ``host_libvirtd_enabled`` default from ``true`` to ``false``
        to honour the Libvirt-free design principle and prevent libvirtd from blocking
        plays when it fails to start (`#75 <https://github.com/maglo/ansible-collection-qemu/issues/75>`_).
      - host role - Remove dead ``"Remove legacy single-instance noVNC service"``
        task; v0.1.0 is the first release and has no legacy service to clean up (`#77
        <https://github.com/maglo/ansible-collection-qemu/issues/77>`_).
      - host role - Rename task ``"Enable and start libvirtd"`` to ``"Manage state
        of libvirtd service"`` to accurately reflect its conditional behaviour (`#76
        <https://github.com/maglo/ansible-collection-qemu/issues/76>`_).
      - vms role - Add ``"Verify VM service is running"`` task after starting ``qemu-vm@<name>.service``;
        the play now fails with a clear error if the service does not reach active
        state (`#79 <https://github.com/maglo/ansible-collection-qemu/issues/79>`_).
      - vms role - Make OVMF firmware paths configurable with per-OS defaults using
        ``ansible_distribution_major_version``; fixes hardcoded path that does not
        exist on EL8 (`#78 <https://github.com/maglo/ansible-collection-qemu/issues/78>`_).
      - vms role - Rename task ``"Enable and start VM service"`` to ``"Manage VM service
        state"`` to accurately reflect its conditional behaviour (`#83 <https://github.com/maglo/ansible-collection-qemu/issues/83>`_).
      - vms role - Replace Jinja2-interpolated task names with static names to comply
        with Ansible best practices (`#82 <https://github.com/maglo/ansible-collection-qemu/issues/82>`_).
      - vms role - Ship a minimal SELinux policy module (``qemu_vm.te``) and tasks
        to compile and install it on EL9/EL10 hosts with SELinux enforcing; fixes
        ``"Permission denied"`` when executing ``/usr/libexec/qemu-kvm`` (`#81 <https://github.com/maglo/ansible-collection-qemu/issues/81>`_).
      release_summary: Bug-fix release addressing 10 issues found during manual testing
        of v0.1.0 on AlmaLinux 8 and EL9 with SELinux enforcing. See `#84 <https://github.com/maglo/ansible-collection-qemu/issues/84>`_
        for the full test report.
    fragments:
    - 85-fix-v010-bugs.yaml
    release_date: '2026-02-21'
  0.2.0:
    changes:
      breaking_changes:
      - 'host - Remove ``host_libvirtd_enabled`` variable and ``libvirt`` from default
        packages. The collection''s libvirt-free design means libvirtd was never needed
        for VM management. Users who need libvirt can add it to ``host_packages``
        (closes #91).'
      bugfixes:
      - collection - Add ``documentation``, ``homepage``, and ``issues`` URLs to ``galaxy.yml``
        metadata (https://github.com/maglo/ansible-collection-qemu/issues/88).
      - collection - Include playbooks in the collection tarball so README links resolve
        on Galaxy (https://github.com/maglo/ansible-collection-qemu/issues/88).
      minor_changes:
      - vms role - Add UEFI Secure Boot support via ``secure_boot`` per-VM key and
        ``vms_default_secure_boot`` global default. When enabled, the role uses OVMF
        Secure Boot firmware with pre-enrolled keys, adds ``smm=on`` to the QEMU machine
        line, and sets the ``cfi.pflash01`` secure property (https://github.com/maglo/ansible-collection-qemu/issues/90).
      release_summary: 'Add UEFI Secure Boot support, fix Galaxy documentation, and
        remove the

        legacy libvirtd management from the host role.

        '
    fragments:
    - 88-fix-galaxy-docs.yaml
    - 90-secure-boot.yaml
    - 91-remove-libvirtd.yaml
    - release-0.2.0-summary.yaml
    release_date: '2026-02-22'
  0.2.1:
    changes:
      bugfixes:
      - 'Replace relative README links with absolute GitHub URLs so they resolve correctly
        on Ansible Galaxy (closes #101).'
      - 'host - Fix SELinux policy to target ``init_t`` instead of ``unconfined_service_t``
        and add ``swtpm_exec_t`` execute rule, resolving VMs failing to start with
        SELinux enforcing on EL9 (closes #99).'
      - 'host - Move SELinux policy installation from ``vms`` role to ``host`` role
        where it architecturally belongs (closes #98).'
      - 'host, vms - Add ``become: true`` to ``Reload systemd`` handlers so ``daemon_reload``
        reaches the system D-Bus socket and does not time out when the play runs without
        top-level ``become`` (closes #104).'
      - 'vms - Add ``-cpu host`` flag to QEMU args so guests expose the host CPU feature
        set; without it QEMU defaults to ``qemu64``, causing a fatal glibc error on
        EL9 (closes #106).'
      - 'vms - Create per-VM runtime directory for the monitor socket when ``state:
        present``, not only for started/stopped/restarted, so ``systemctl start qemu-vm@<name>``
        works without a second playbook run (closes #105).'
      - 'vms - Fail early when ``novnc_enabled`` is set but the ``novnc@.service``
        template is absent, and add a systemd drop-in so the VM unit depends on its
        noVNC service (closes #100).'
      - 'vms - Replace Jinja2 loop variable in TPM drop-in task ``name:`` field with
        a static string to avoid literal ``{{ item.name }}`` appearing in loop output
        (closes #103).'
    fragments:
    - 100-novnc-prerequisite.yaml
    - 101-readme-galaxy-links.yaml
    - 102-galaxy-hide-playbooks.yaml
    - 103-tpm-task-name.yaml
    - 104-systemd-handler-become.yaml
    - 105-monitor-runtime-dir.yaml
    - 109-cpu-host-flag.yaml
    - 98-99-selinux-move-and-fix.yaml
    release_date: '2026-02-24'
  0.2.2:
    changes:
      bugfixes:
      - 'host - Add ``become: true`` to SELinux policy compile and package tasks to
        prevent ``Permission denied`` errors when ``/tmp/qemu_vm.mod`` or ``/tmp/qemu_vm.pp``
        are root-owned from a previous run (https://github.com/maglo/ansible-collection-qemu/issues/118).'
      - host - Extend SELinux policy (v1.2) to grant ``init_t`` permission to create
        the QEMU monitor unix socket and access ``/dev/kvm``; fixes VM startup ``Permission
        denied`` errors on EL9/EL10 with SELinux enforcing (https://github.com/maglo/ansible-collection-qemu/issues/119).
    fragments:
    - 121-selinux-fixes.yaml
    release_date: '2026-02-24'
